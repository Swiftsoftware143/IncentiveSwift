<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Base — IncentiveSwift</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink); background:#f8fafc; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:18px 22px; position:sticky; top:0; z-index:5; }
  .wrap { max-width:1080px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
  .brand span:first-child { font-size:22px; }
  .tabs { display:flex; gap:6px; margin-top:14px; }
  .tab { padding:8px 16px; border-radius:8px 8px 0 0; font-size:14px; cursor:pointer;
         border:1px solid transparent; border-bottom:none; background:#f1f5f9; color:var(--muted); }
  .tab.on { background:#fff; color:var(--ink); font-weight:600; border-color:var(--line); }
  main { display:grid; grid-template-columns:250px 1fr; gap:26px; padding:26px 22px 60px; }
  nav article { display:block; width:100%; text-align:left; background:none; border:none; padding:7px 10px;
                border-radius:7px; font-size:13.5px; color:#334155; cursor:pointer; }
  nav article:hover { background:#eef2f7; }
  nav article.on { background:#dbeafe; color:#1e40af; font-weight:600; }
  nav h4 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
           margin:16px 0 6px 10px; }
  .doc { background:#fff; border:1px solid var(--line); border-radius:12px; padding:26px 30px; min-height:320px; }
  .doc h1 { margin:0 0 6px; font-size:24px; }
  .meta { color:var(--muted); font-size:12.5px; margin-bottom:18px; }
  .doc pre { white-space:pre-wrap; font-family:inherit; font-size:15px; line-height:1.65; margin:0; }
  .empty, .err { color:var(--muted); font-size:14px; }
  .err { color:#b91c1c; }
  .note { margin-top:26px; padding:12px 14px; background:#eff6ff; border:1px solid #bfdbfe;
          border-radius:9px; font-size:13px; color:#1e3a8a; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } nav { display:flex; flex-wrap:wrap; gap:4px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><span>📚</span><span>Knowledge Base</span>
    <span style="font-weight:400;color:var(--muted);font-size:13px">IncentiveSwift</span></div>
  <div class="tabs">
    <div class="tab" id="tab-user" onclick="pick('user')">Playing (users)</div>
    <div class="tab" id="tab-admin" onclick="pick('admin')">Running it (admin)</div>
  </div>
</div></header>
<main class="wrap">
  <nav id="toc"></nav>
  <section class="doc" id="doc"><div class="empty">Loading…</div></section>
</main>
<script>
// One reader, two sides. The side is a filter on the SAME articles, which is what keeps an admin
// walkthrough and a user walkthrough "in line respectively" rather than two documents that drift.
var API = location.origin + '/api/v1';
var side = 'user';
var articles = [];

function esc(s){ return (s == null ? '' : String(s)).replace(/[<>&]/g, function(c){
  return ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]; }); }

function pick(s){
  side = s;
  document.getElementById('tab-user').className  = 'tab' + (s === 'user'  ? ' on' : '');
  document.getElementById('tab-admin').className = 'tab' + (s === 'admin' ? ' on' : '');
  load();
}

function load(){
  var toc = document.getElementById('toc'), doc = document.getElementById('doc');
  toc.innerHTML = ''; doc.innerHTML = '<div class="empty">Loading…</div>';
  fetch(API + '/knowledge-base?audience=' + side)
    .then(function(r){
      if (r.status === 401) throw new Error('The admin walkthrough is for signed-in account holders. ' +
                                            'Sign in to the console to read it.');
      if (!r.ok) throw new Error('Could not load this side (' + r.status + ')');
      return r.json();
    })
    .then(function(d){
      articles = (d && d.articles) || [];
      if (!articles.length){
        toc.innerHTML = '';
        doc.innerHTML = '<div class="empty">Nothing published on this side yet.</div>';
        return;
      }
      var groups = {}, order = [];
      articles.forEach(function(a){
        var g = a.category || 'Guides';
        if (!groups[g]) { groups[g] = []; order.push(g); }
        groups[g].push(a);
      });
      toc.innerHTML = order.map(function(g){
        return '<h4>' + esc(g) + '</h4>' + groups[g].map(function(a){
          return '<article onclick="open_(\'' + a.slug + '\')" id="toc-' + esc(a.slug) + '">' +
                 esc(a.title) + '</article>';
        }).join('');
      }).join('');
      open_(articles[0].slug);
    })
    .catch(function(e){
      doc.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
}

function open_(slug){
  var doc = document.getElementById('doc');
  Array.prototype.forEach.call(document.querySelectorAll('nav article'), function(el){
    el.className = (el.id === 'toc-' + slug) ? 'on' : '';
  });
  doc.innerHTML = '<div class="empty">Loading…</div>';
  fetch(API + '/knowledge-base/article/' + encodeURIComponent(slug) + '?audience=' + side)
    .then(function(r){ if (!r.ok) throw new Error('Could not open that article'); return r.json(); })
    .then(function(a){
      doc.innerHTML =
        '<h1>' + esc(a.title) + '</h1>' +
        '<div class="meta">' + esc(a.category || 'Guide') +
          (a.updated_at ? ' · updated ' + esc(String(a.updated_at).slice(0, 10)) : '') + '</div>' +
        '<pre>' + esc(a.content || '(no content yet)') + '</pre>' +
        '<div class="note">Written by the operator of this account and shown to ' +
          (side === 'admin' ? 'account holders' : 'players') +
          '. If something here is out of date, it is edited from the console under <b>Knowledge Base</b>.</div>';
    })
    .catch(function(e){ doc.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

// The console is where the admin side belongs; a user landing here should get the user side first.
pick('user');
</script>
</body>
</html>
