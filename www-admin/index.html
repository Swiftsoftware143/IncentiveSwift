<script>
/* Long-form qualifier config merge.
   `config.sections` is an ORDERING-ONLY overlay: it decides the public form's presentation
   order and never touches scoring, outcomes, tags, redirects or the webhook.
   `campaigns.config` is JSONB and is replaced WHOLESALE on save, so sections MUST be merged
   INTO the existing config object -- never replace it -- or rules/outcomes get wiped.
   Pure and DOM-free on purpose, so it can be unit-tested outside the browser. */
function islfMergeSections(cfg, sections) {
  var out = {};
  if (cfg && typeof cfg === 'object') {
    for (var k in cfg) { if (Object.prototype.hasOwnProperty.call(cfg, k)) out[k] = cfg[k]; }
  }
  out.sections = Array.isArray(sections) ? sections : [];
  return out;
}
</script>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.26.4';
// Hooks are NOT exported from preact's root module — they live in /hooks. Importing useEffect
// from the root threw "does not provide an export named 'useEffect'", which killed the whole
// module and left the admin dashboard rendering nothing in production.
import { useState, useEffect } from 'https://esm.sh/preact@10.26.4/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

const showUpgradePrompt = (msg) => {
  const div = document.createElement('div');
  div.className = 'upgrade-overlay';
  div.innerHTML = '<div class="upgrade-box"><h2>🚀 Upgrade Required</h2><p>' + (msg || 'This feature requires a higher plan.') + '</p><button class="btn-upgrade" onclick="this.closest(\'.upgrade-overlay\').remove()">Got it</button></div>';
  document.body.appendChild(div);
  div.addEventListener('click', (e) => { if (e.target === div) div.remove(); });
};


const API = (() => {
  const base = window.location.origin + '/api/v1';
  let token = sessionStorage.getItem('is_token');
  let user = JSON.parse(sessionStorage.getItem('is_user') || 'null');

  const headers = () => ({ 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) });
  const handle = async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error || d.message || 'Request failed'); return d; };
  const login = (e, p) => fetch(base + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:e,password:p}) }).then(handle);
  const get = (p) => fetch(base + p, {headers:headers()}).then(handle).catch(e => { console.error(e); throw e; });
  const post = (p, b) => fetch(base + p, {method:'POST', headers:headers(), body:JSON.stringify(b)}).then(handle);
  const put = (p, b) => fetch(base + p, {method:'PUT', headers:headers(), body:JSON.stringify(b)}).then(handle);
  const del = (p) => fetch(base + p, {method:'DELETE', headers:headers()}).then(handle);
  return {
    login, get, post, put, del,
    get token(){ return token; },
    get user(){ return user; },
    setAuth(t, u){ token = t; user = u; sessionStorage.setItem('is_token', t); sessionStorage.setItem('is_user', JSON.stringify(u)); },
    logout(){ token = null; user = null; sessionStorage.removeItem('is_token'); sessionStorage.removeItem('is_user'); }
  };
})();

const S = { view: 'dashboard', loading: false, error: null, views: {} };
// Wrap API to catch 402 upgrade prompts
const _get = API.get, _post = API.post, _put = API.put, _del = API.del;
API.get = async (p) => _get(p).catch(e => { if (e.message && e.message.includes('Upgrade')) showUpgradePrompt(e.message); throw e; });
API.post = async (p, b) => _post(p, b).catch(e => { if (e.message && e.message.includes('Upgrade')) showUpgradePrompt(e.message); throw e; });
API.put = async (p, b) => _put(p, b).catch(e => { if (e.message && e.message.includes('Upgrade')) showUpgradePrompt(e.message); throw e; });
API.del = async (p) => _del(p).catch(e => { if (e.message && e.message.includes('Upgrade')) showUpgradePrompt(e.message); throw e; });

const viewState = (name, defaults = {}) => { if (!S.views[name]) S.views[name] = Object.assign({}, defaults); return S.views[name]; };

// ---- LOGIN ----
const LoginView = () => {
  let email = '', pw = '';
  const submit = async (e) => { e.preventDefault(); S.loading = true; S.error = null; renderApp();
    try { const r = await API.login(email, pw); API.setAuth(r.token, r.user); S.view = 'dashboard'; } catch(err) { S.error = err.message; }
    S.loading = false; renderApp();
  };
  return html`<div class="flex items-center justify-center min-h-screen w-full">
    <div class="card w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <div class="text-3xl mb-2">🎯</div>
        <h1 class="text-xl font-bold text-gray-800">IncentiveSwift</h1>
        <p class="text-sm text-gray-500 mt-1">Incentive & Loyalty Platform</p>
      </div>
      <form onSubmit=${submit} class="space-y-4">
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Email</label><input type="email" class="input" value=${email} onInput=${e => email = e.target.value} placeholder="admin@company.com" required /></div>
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Password</label><input type="password" class="input" value=${pw} onInput=${e => pw = e.target.value} placeholder="......" required /></div>
        ${S.error && html`<div class="text-red-600 text-sm bg-red-50 p-2 rounded-lg">${S.error}</div>`}
        <button type="submit" class="btn w-full">Sign In</button>
      </form>
    </div>
  </div>`;
};

// ---- DASHBOARD ----
const Dashboard = () => {
  const st = viewState('dashboard', {});
  if (!st._loaded) { st._loaded = true;
    API.get('/dashboard/stats').then(s => { Object.assign(st, s); renderApp(); }).catch(() => {});
  }
  return html`<div>
    <h2 class="text-xl font-bold mb-4">Dashboard</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="stat-card"><div class="stat-value">${st.total_plans ?? '...'}</div><div class="stat-label">Plans</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_campaigns ?? '...'}</div><div class="stat-label">Campaigns</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_programs ?? '...'}</div><div class="stat-label">Loyalty Programs</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_users ?? '...'}</div><div class="stat-label">Users</div></div>
    </div>
  </div>`;
};

// ---- PORTFOLIO ----
const Portfolio = () => {
  const st = viewState('portfolio', { list: [], showModal: false, editItem: null, search: '' });
  const load = async () => { try { const data = await API.get('/portfolio-companies'); st.list = (data && data.companies) ? data.companies : (Array.isArray(data) ? data : []); renderApp(); } catch(e) { try { const data2 = await API.get('/portfolio-companies'); st.list = (data2 && data2.companies) ? data2.companies : (Array.isArray(data2) ? data2 : []); renderApp(); } catch(e2) { console.error(e2); } } };
  if (!st._loaded) { st._loaded = true; load(); }

  const show = (item) => { st.editItem = item; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => {
    try { if(st.editItem) await API.put('/portfolio-companies/' + st.editItem.id, data); else await API.post('/portfolio-companies', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };
  const remove = async (id) => { if(!confirm('Delete this portfolio company?')) return; await API.del('/portfolio-companies/' + id); load(); };
  const impersonate = async (company) => {
    if(!confirm('Impersonate as ' + company.name + '?')) return;
    try {
      const r = await API.post('/admin/impersonate', { account_id: company.account_id || company.id });
      sessionStorage.setItem('impersonate_token', r.token);
      sessionStorage.setItem('impersonate_company', JSON.stringify(company));
      window.open('https://incentiveswift.com', '_blank');
    } catch(e) { alert('Impersonation failed: ' + e.message); }
  };

  const filtered = st.list.filter(c => !st.search || (c.name||'').toLowerCase().includes(st.search.toLowerCase()) || (c.slug||'').toLowerCase().includes(st.search.toLowerCase()) || (c.domain||'').toLowerCase().includes(st.search.toLowerCase()));

  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Portfolio Companies</h2><div class="flex gap-2 items-center"><input class="input" style="width:240px" placeholder="Search..." value=${st.search || ''} onInput=${e => { st.search = e.target.value; renderApp(); }} /><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add Company</button></div></div>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Slug</th><th>Actions</th></tr></thead>
        <tbody>${filtered.map(c => html`<tr>
          <td class="font-medium">${c.name}</td><td class="text-gray-500">${c.slug || c.domain || '-'}</td>
          <td><button class="btn btn-sm btn-blue" onClick=${() => impersonate(c)} title="Impersonate">🔑 Impersonate</button><button class="btn btn-sm btn-outline" onClick=${() => { show(c); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(c.id)}>Delete</button></td>
        </tr>`)}
        ${filtered.length === 0 && html`<tr><td colspan="3" class="text-center text-gray-400 py-8">No portfolio companies yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Portfolio Company</h3>
        ${(() => { let name = st.editItem?.name||'', slug = st.editItem?.slug||'';
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Company Name</label><input class="input" value=${name} onInput=${e => name = e.target.value} /></div>
            <div><label class="text-sm font-medium block mb-1">Slug</label><input class="input" value=${slug} onInput=${e => slug = e.target.value} /></div>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button>
              <button class="btn" onClick=${() => save({name,slug})}>${st.editItem ? 'Save' : 'Add'}</button>
            </div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

// ---- PLANS ----
const Plans = () => {
  const st = viewState('plans', { list: [], showModal: false, editItem: null });

  const show = (item) => { st.editItem = item; st.showModal = true; renderApp(); };

  const save = async (data) => {
    try { if(st.editItem) await API.put('/plans/' + st.editItem.id, data); else await API.post('/plans', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };

  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Plans</h2><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add Plan</button></div>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Price</th><th>Interval</th><th>Actions</th></tr></thead>
        <tbody>${st.list.map(p => html`<tr>
          <td class="font-medium">${p.name}</td>
          <td class="text-gray-500">${p.price ? '$' + p.price : '-'}</td>
          <td class="text-gray-500">${p.interval || '-'}</td>
          <td><button class="btn btn-sm btn-outline" onClick=${() => { show(p); }}>Edit</button></td>
        </tr>`)}
        ${st.list.length === 0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No plans yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Plan</h3>
        ${(() => { let name = st.editItem?.name||'', price = st.editItem?.price||'', interval = st.editItem?.interval||'monthly';
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${name} onInput=${e => name = e.target.value} /></div>
            <div><label class="text-sm font-medium block mb-1">Price</label><input type="number" class="input" value=${price} onInput=${e => price = e.target.value} /></div>
            <div><label class="text-sm font-medium block mb-1">Interval</label><select class="input" value=${interval} onChange=${e => interval = e.target.value}><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="one-time">One Time</option></select></div>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button>
              <button class="btn" onClick=${() => save({name,price,interval})}>${st.editItem ? 'Save' : 'Add'}</button>
            </div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

// ---- PLAN TIERS (tier_features CRUD) ----
const PlanTiers = () => {
  const st = viewState('plantiers', { tiers: [], selectedId: null, features: [], editTier: null, editModal: false });

  const loadTiers = async () => { try { const d = await API.get('/admin/tiers'); st.tiers = d.tiers || []; renderApp(); } catch(e) { console.error(e); } };
  if (!st._loaded) { st._loaded = true; loadTiers(); }

  const selectTier = (tier) => { st.selectedId = tier.id; st.features = []; renderApp(); loadFeatures(tier.id); };
  const loadFeatures = async (tierId) => { try { const d = await API.get('/admin/tiers/' + tierId + '/features'); st.features = d.features || []; renderApp(); } catch(e) { alert(e.message); } };

  const toggleFeature = async (f, enabled) => {
    try { await API.put('/admin/tiers/' + st.selectedId + '/features/' + f.feature_key, { enabled, limit_value: f.limit_value ?? null }); loadFeatures(st.selectedId); }
    catch(e) { alert(e.message); }
  };
  const setLimit = async (f, val) => {
    const num = (val === '' || val === null || val === undefined) ? null : parseInt(val, 10);
    try { await API.put('/admin/tiers/' + st.selectedId + '/features/' + f.feature_key, { enabled: f.enabled, limit_value: num }); loadFeatures(st.selectedId); }
    catch(e) { alert(e.message); }
  };

  const openEdit = (tier) => { st.editTier = tier ? { ...tier } : null; st.editModal = true; renderApp(); };
  const closeEdit = () => { st.editModal = false; renderApp(); };
  const saveTier = async (data) => { try { await API.put('/admin/tiers/' + st.editTier.id, data); closeEdit(); loadTiers(); } catch(e) { alert(e.message); } };

  // Group features by category.
  const groups = {};
  (st.features || []).forEach(f => { const c = f.category || 'other'; (groups[c] = groups[c] || []).push(f); });
  const CATEGORY_ORDER = ['mechanic','delivery','branding','surface','module','loyalty','limits','billing'];
  const catKeys = Object.keys(groups).sort((a,b) => {
    const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const selected = (st.tiers || []).find(t => t.id === st.selectedId);

  return html`<div>
    <div class="mb-4">
      <h2 class="text-xl font-bold">Plan Tiers</h2>
      <p class="text-sm text-gray-500">Add or subtract features per tier. Changes hit the live runtime gate immediately.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <div class="space-y-3">
        ${(st.tiers || []).map(t => html`<div class="card cursor-pointer ${st.selectedId === t.id ? 'ring-2 ring-blue-500' : ''}" onClick=${() => selectTier(t)}>
          <div class="flex items-center justify-between">
            <h3 class="font-bold">${t.name}</h3>
            <span class="badge ${t.is_active ? 'badge-green' : 'badge-red'}">${t.is_active ? 'Active' : 'Off'}</span>
          </div>
          <div class="text-sm text-gray-500">${t.slug}</div>
          <div class="text-sm font-medium mt-1">$${t.price_monthly ?? 0}<span class="text-xs text-gray-400">/mo</span></div>
          <div class="mt-2"><button class="btn btn-sm btn-outline" onClick=${(e) => { e.stopPropagation(); openEdit(t); }}>Edit tier</button></div>
        </div>`)}
        ${(st.tiers || []).length === 0 && html`<div class="card text-center text-gray-400 py-8">No tiers found.</div>`}
      </div>
      <div class="lg:col-span-3">
        ${selected ? html`<div>
          <div class="card mb-4">
            <h3 class="font-bold mb-2">${selected.name} — Features</h3>
            <div class="flex flex-wrap gap-4 text-sm text-gray-600">
              <span>Campaigns: <b>${selected.max_campaigns ?? '—'}</b></span>
              <span>Entries/month: <b>${selected.max_entries_per_month ?? '—'}</b></span>
              <span>Annual: <b>$${selected.price_annual ?? 0}</b></span>
            </div>
          </div>
          ${catKeys.map(cat => html`<div class="card mb-4">
            <h4 class="font-bold text-sm uppercase text-gray-500 mb-3">${cat}</h4>
            <div class="space-y-2">
              ${groups[cat].map(f => html`<div class="flex items-center gap-3 py-1 border-b border-gray-100">
                <input type="checkbox" checked=${f.enabled} onChange=${(e) => toggleFeature(f, e.target.checked)} class="w-4 h-4" />
                <div class="flex-1">
                  <div class="text-sm font-medium">${f.label}</div>
                  <div class="text-xs text-gray-400 font-mono">${f.feature_key}</div>
                </div>
                <input type="number" class="input" style="width:90px" placeholder="limit" value=${f.limit_value ?? ''} onInput=${(e) => { f.limit_value = e.target.value === '' ? null : parseInt(e.target.value, 10); }} onBlur=${(e) => setLimit(f, e.target.value)} />
                <span class="badge ${f.enabled ? 'badge-green' : 'badge-red'}">${f.enabled ? 'ADDED' : 'REMOVED'}</span>
              </div>`)}
            </div>
          </div>`)}
        </div>` : html`<div class="card text-center text-gray-400 py-12">Select a tier to manage its features.</div>`}
      </div>
    </div>
    ${st.editModal && st.editTier ? html`<div class="modal" onClick=${(e) => e.target === e.currentTarget && closeEdit()}>
      <div class="modal-content">
        <h3 class="text-lg font-bold mb-4">Edit Tier</h3>
        ${(() => {
          let t = st.editTier;
          let name = t.name || '', slug = t.slug || '', pm = t.price_monthly ?? '', pa = t.price_annual ?? '', mc = t.max_campaigns ?? '', me = t.max_entries_per_month ?? '', active = t.is_active !== false;
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${name} onInput=${e => name = e.target.value} /></div>
            <div><label class="text-sm font-medium block mb-1">Slug</label><input class="input" value=${slug} onInput=${e => slug = e.target.value} /></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="text-sm font-medium block mb-1">Price Monthly</label><input type="number" class="input" value=${pm} onInput=${e => pm = e.target.value} /></div>
              <div><label class="text-sm font-medium block mb-1">Price Annual</label><input type="number" class="input" value=${pa} onInput=${e => pa = e.target.value} /></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="text-sm font-medium block mb-1">Max Campaigns (-1 unlimited)</label><input type="number" class="input" value=${mc} onInput=${e => mc = e.target.value} /></div>
              <div><label class="text-sm font-medium block mb-1">Max Entries/Month (-1 unlimited)</label><input type="number" class="input" value=${me} onInput=${e => me = e.target.value} /></div>
            </div>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked=${active} onChange=${e => active = e.target.checked} /> Active</label>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${closeEdit}>Cancel</button>
              <button class="btn" onClick=${() => saveTier({ name, slug, price_monthly: pm === '' ? null : parseFloat(pm), price_annual: pa === '' ? null : parseFloat(pa), max_campaigns: mc === '' ? null : parseInt(mc, 10), max_entries_per_month: me === '' ? null : parseInt(me, 10), is_active: active })}>Save</button>
            </div>
          </div>`;
        })()}
      </div>
    </div>` : null}
  </div>`;
};

const Campaigns = () => {
  const st = viewState('campaigns', { list: [], showModal: false, editItem: null, search: '', theme: null });

  if (!st._loaded) { st._loaded = true; load(); }

  const show = (item) => {
    st.editItem = item || null;
    st.theme = null;
    if (item && item.id) {
      API.get('/admin/campaigns/' + item.id + '/surface')
        .then(d => { st.theme = d.theme || THEME_DEFAULTS; renderApp(); })
        .catch(() => { st.theme = { ...THEME_DEFAULTS }; renderApp(); });
    }
    st.showModal = true;
    renderApp();
  };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => {
    try { if(st.editItem && st.editItem.id) await API.put('/campaigns/' + (st.editItem.slug || st.editItem.id), data); else await API.post('/campaigns', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };
  const remove = async (id) => { if(!confirm('Delete?')) return; await API.del('/campaigns/' + id); load(); };

  const filtered = st.list.filter(c => !st.search || (c.name||'').toLowerCase().includes(st.search.toLowerCase()));

  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Campaigns</h2><div class="flex gap-2 items-center"><input class="input" style="width:240px" placeholder="Search..." value=${st.search || ''} onInput=${e => { st.search = e.target.value; renderApp(); }} /><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add Campaign</button></div></div>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${filtered.map(c => html`<tr>
          <td class="font-medium">${c.name}</td>
          <td><span class="badge badge-blue">${c.type || '—'}</span></td>
          <td><span class="badge ${c.status === 'active' ? 'badge-green' : 'badge-yellow'}">${c.status || 'draft'}</span></td>
          <td><button class="btn btn-sm btn-outline" onClick=${() => { show(c); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(c.id)}>Delete</button></td>
        </tr>`)}
        ${filtered.length === 0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No campaigns yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content" style="max-width:760px"><h3 class="text-lg font-bold mb-4">${st.editItem && st.editItem.id ? 'Edit' : 'Add'} Campaign</h3>
        ${(() => {
          const isEdit = !!(st.editItem && st.editItem.id);
          let name = st.editItem?.name || '';
          let type = st.editItem?.type || 'spin_wheel';
          let tagNamespace = st.editItem?.tag_namespace || '';
          let config = st.editItem?.config ? JSON.stringify(st.editItem.config, null, 2) : JSON.stringify(MECHANIC_DEFAULT_CONFIG[type] || {}, null, 2);
          const setType = (t) => { type = t; if (!isEdit) { config = JSON.stringify(MECHANIC_DEFAULT_CONFIG[t] || {}, null, 2); } renderApp(); };
          const doSave = () => {
            let parsed = {};
            try { parsed = config && config.trim() ? JSON.parse(config) : {}; } catch(err) { alert('Config JSON is invalid: ' + err.message); return; }
            const payload = isEdit ? { name, config: parsed } : { name, type, tag_namespace: tagNamespace || (name || 'campaign').toLowerCase().replace(/[^a-z0-9]+/g, '_'), config: parsed };
            save(payload);
          };
          // ── Long-form qualifier: sections (ordering-only overlay) ──────────────
          // Sections group existing question keys. They must NEVER wipe rules/outcomes,
          // so every mutation re-parses the live JSON and merges via islfMergeSections.
          let parsedCfg = {};
          try { parsedCfg = config && config.trim() ? JSON.parse(config) : {}; } catch(e) { parsedCfg = {}; }
          const lfOn = type === 'long_form_qualifier';
          const ruleKeys = (lfOn && Array.isArray(parsedCfg.rules) ? parsedCfg.rules : [])
            .map(r => r && r.question).filter(k => typeof k === 'string' && k.length);
          const sections = (lfOn && Array.isArray(parsedCfg.sections)) ? parsedCfg.sections : [];
          const commitSections = (next) => {
            let base = parsedCfg;
            try { base = config && config.trim() ? JSON.parse(config) : parsedCfg; } catch(e) { base = parsedCfg; }
            config = JSON.stringify(islfMergeSections(base, next), null, 2);   // merge, never overwrite
            renderApp();
          };
          const addSection = () => commitSections([...sections, { title: 'Section ' + (sections.length + 1), questions: [] }]);
          const setSectionTitle = (i, v) => commitSections(sections.map((s, j) => j === i ? { ...s, title: v } : s));
          const removeSection = (i) => commitSections(sections.filter((_, j) => j !== i));
          const toggleKey = (i, k) => commitSections(sections.map((s, j) => {
            if (j !== i) return s;
            const cur = Array.isArray(s.questions) ? s.questions : [];
            return { ...s, questions: cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k] };
          }));
          // Theme editor (surface_config.theme) — edit-only (needs an existing campaign id).
          const theme = st.theme || { ...THEME_DEFAULTS };
          const setTheme = (k, v) => { st.theme = { ...(st.theme || THEME_DEFAULTS), [k]: v }; renderApp(); };
          const saveTheme = async () => {
            try { await API.put('/admin/campaigns/' + st.editItem.id + '/surface', { surface_config: { theme: st.theme || THEME_DEFAULTS } }); alert('Theme saved'); }
            catch(e) { alert('Theme save failed: ' + e.message); }
          };
          const resetTheme = () => { st.theme = { ...THEME_DEFAULTS }; renderApp(); };
          const radiusPx = parseInt(theme.border_radius, 10) || 12;
          const colorField = (key, label) => html`<div><label class="text-xs font-medium block mb-1 text-gray-500">${label}</label><input type="color" value=${theme[key] || ''} onInput=${e => setTheme(key, e.target.value)} class="input" style="height:36px;padding:3px;width:100%;cursor:pointer" /></div>`;
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${name} onInput=${e => { name = e.target.value; }} /></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="text-sm font-medium block mb-1">Mechanic Type</label>
                <select class="input" value=${type} onChange=${e => setType(e.target.value)} disabled=${isEdit}>
                  ${MECHANICS.map(m => html`<option value=${m.id}>${m.label}</option>`)}
                </select>
              </div>
              <div><label class="text-sm font-medium block mb-1">Tag Namespace</label><input class="input" value=${tagNamespace} placeholder="e.g. Summer_Giveaway" disabled=${isEdit} onInput=${e => { tagNamespace = e.target.value; }} /></div>
            </div>
            <div><label class="text-sm font-medium block mb-1">Config (JSON)</label><textarea class="input" rows="10" style="font-family:monospace;font-size:12px" value=${config} onInput=${e => { config = e.target.value; }}></textarea></div>
            ${lfOn && html`<div class="border-t border-gray-100 pt-3 mt-3">
              <div class="flex items-center justify-between mb-2">
                <div class="text-sm font-semibold">🧩 Sections <span class="text-xs text-gray-400">(presentation order only — scoring, outcomes, tags, redirects and the webhook are unchanged)</span></div>
                <button class="btn btn-sm btn-outline" onClick=${addSection}>+ Add section</button>
              </div>
              ${ruleKeys.length === 0 && html`<div class="text-xs text-gray-400 mb-2">No question keys in config.rules yet — add rules above, then group them here.</div>`}
              ${sections.map((s, i) => html`<div class="p-2 mb-2 rounded" style="border:1px solid #e2e8f0">
                <div class="flex gap-2 items-center mb-1">
                  <input class="input" value=${s.title || ''} placeholder="Section title" onInput=${e => setSectionTitle(i, e.target.value)} />
                  <button class="btn btn-sm btn-red" onClick=${() => removeSection(i)}>✕</button>
                </div>
                <div class="flex flex-wrap gap-3">${ruleKeys.map(k => html`<label class="text-xs" style="display:flex;align-items:center;gap:4px">
                  <input type="checkbox" checked=${(s.questions || []).includes(k)} onChange=${() => toggleKey(i, k)} />${k}</label>`)}</div>
              </div>`)}
              <div class="text-xs text-gray-400">Saving merges <code>sections</code> into <code>config</code> — <code>rules</code> and <code>outcomes</code> are preserved. Questions not assigned to a section still appear on the public form (trailing); unknown keys are ignored.</div>
            </div>`}
            ${isEdit && html`<div class="border-t border-gray-100 pt-3 mt-3">
              <div class="flex items-center justify-between mb-2">
                <div class="text-sm font-semibold">🎨 Theme</div>
                <div class="flex gap-2">
                  <button class="btn btn-sm btn-outline" onClick=${resetTheme}>Reset to default</button>
                  <button class="btn btn-sm btn-blue" onClick=${saveTheme}>Save Theme</button>
                </div>
              </div>
              <div class="grid grid-cols-5 gap-2">
                ${colorField('primary_color', 'Primary')}
                ${colorField('accent_color', 'Accent')}
                ${colorField('background_color', 'Background')}
                ${colorField('text_color', 'Text')}
                ${colorField('button_text_color', 'Button text')}
              </div>
              <div class="grid grid-cols-2 gap-3 mt-3">
                <div><label class="text-xs font-medium block mb-1 text-gray-500">Font family</label>
                  <select class="input" value=${theme.font_family || THEME_DEFAULTS.font_family} onChange=${e => setTheme('font_family', e.target.value)}>${FONT_OPTIONS.map(f => html`<option value=${f}>${f.split(',')[0]}</option>`)}</select>
                </div>
                <div><label class="text-xs font-medium block mb-1 text-gray-500">Border radius: <b>${radiusPx}px</b></label>
                  <input type="range" min="0" max="24" step="1" value=${radiusPx} style="width:100%" onInput=${e => setTheme('border_radius', e.target.value)} />
                </div>
              </div>
              <div class="flex items-center gap-2 mt-3">
                <input type="checkbox" id="is-dark-mode" checked=${!!theme.dark_mode} onChange=${e => setTheme('dark_mode', e.target.checked)} />
                <label for="is-dark-mode" class="text-sm text-gray-600">Dark mode</label>
              </div>
              <div class="mt-3 p-3 rounded-lg" style="background:${theme.background_color};color:${theme.text_color};font-family:${theme.font_family};border-radius:${radiusPx}px;border:1px solid #e2e8f0">
                <div style="font-size:14px;font-weight:600">Preview</div>
                <div style="font-size:12px;color:${theme.accent_color};margin-top:2px">Accent highlight</div>
                <button style="margin-top:8px;background:${theme.primary_color};color:${theme.button_text_color};border:none;border-radius:${radiusPx}px;padding:6px 14px;font-weight:600;cursor:pointer">Primary button</button>
              </div>
            </div>`}
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button>
              <button class="btn" onClick=${doSave}>${isEdit ? 'Save' : 'Create Campaign'}</button>
            </div>
          </div>`;
        })()}
      </div>
    </div>`}
  </div>`;
};

function loadSiteConfig() {
  const el = document.getElementById('scform');
  if (!el) return;
  el.innerHTML = '<p class="text-gray-500 text-sm">Loading...</p>';
  API.get('/admin/site').then(d => {
    if (!d) { el.innerHTML='<p class="text-red-500">Not available.</p>'; return; }
    const hp = d.homepage || {};
    const f = (n, v, t) => t==='textarea'
      ? `<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><textarea name="${n}" rows="3" class="w-full border rounded px-3 py-2 text-sm"></textarea></div>`
      : `<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><input name="${n}" class="w-full border rounded px-3 py-2 text-sm"></div>`;
    const g = id => { const e = document.querySelector('[name="'+id+'"]'); return e ? e.value : ''; };
    let h = '';
    h += '<div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">🔍 SEO & Meta</h3>';
    h += f('title','Page Title')+f('description','Meta Description','textarea')+f('keywords','Keywords','textarea');
    h += f('canonical_url','Canonical URL')+f('og_title','OG Title')+f('og_description','OG Description','textarea');
    h += f('og_image_url','OG Image URL')+f('favicon_url','Favicon URL');
    h += '</div>';
    h += '<div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">📊 Analytics & Tracking</h3>';
    h += f('ga_id','Google Analytics ID')+f('gtm_id','Google Tag Manager ID');
    h += f('head_scripts','Head Scripts','textarea')+f('body_scripts','Body Scripts','textarea');
    h += '</div>';
    h += '<div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">🏠 Homepage</h3>';
    h += f('homepage_logo_text','Logo Text')+f('homepage_headline','Headline','textarea');
    h += f('homepage_subheadline','Subheadline','textarea')+f('homepage_button_text','CTA Button');
    h += f('homepage_secondary_button_text','Secondary Button');
    h += '</div>';
    h += '<div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">⚖️ Legal Pages</h3>';
    h += '<p class="text-xs text-gray-400 mb-2">Rendered at /terms.html, /privacy.html, /refunds.html</p>';
    h += f('legal_tos','Terms of Service','textarea')+f('legal_privacy','Privacy Policy','textarea');
    h += f('legal_refunds','Refund & Cancellation Policy','textarea');
    h += '</div>';
    h += '<div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">📋 Structured Data</h3>';
    h += f('schema_json','Schema.org JSON','textarea');
    h += '</div>';
    h += '<button class="btn btn-primary" id="scsave">Save Site Configuration</button> <span id="scstatus" class="text-sm ml-2"></span>';
    el.innerHTML = h;
    // Populate
    const sv = (nm,v) => { const e = document.querySelector('[name="'+nm+'"]'); if(e)e.value=v||''; };
    sv('title',d.title);sv('description',d.description);sv('keywords',d.keywords);
    sv('canonical_url',d.canonical_url);sv('og_title',d.og_title);sv('og_description',d.og_description);
    sv('og_image_url',d.og_image_url);sv('favicon_url',d.favicon_url);
    sv('ga_id',d.ga_id);sv('gtm_id',d.gtm_id);sv('head_scripts',d.head_scripts);sv('body_scripts',d.body_scripts);
    sv('homepage_logo_text',hp.logo_text);sv('homepage_headline',hp.headline);
    sv('homepage_subheadline',hp.subheadline);sv('homepage_button_text',hp.button_text);
    sv('homepage_secondary_button_text',hp.secondary_button_text);
    sv('legal_tos',d.legal_tos);sv('legal_privacy',d.legal_privacy);sv('legal_refunds',d.legal_refunds);
    sv('schema_json',d.schema_json);
    document.getElementById('scsave').onclick = async () => {
      const body = {};
      body.title=g('title');body.description=g('description');body.keywords=g('keywords');
      body.canonical_url=g('canonical_url');body.og_title=g('og_title');body.og_description=g('og_description');
      body.og_image_url=g('og_image_url');body.favicon_url=g('favicon_url');
      body.ga_id=g('ga_id');body.gtm_id=g('gtm_id');body.head_scripts=g('head_scripts');body.body_scripts=g('body_scripts');
      body.homepage={logo_text:g('homepage_logo_text'),headline:g('homepage_headline'),subheadline:g('homepage_subheadline'),button_text:g('homepage_button_text'),secondary_button_text:g('homepage_secondary_button_text')};
      body.legal_tos=g('legal_tos');body.legal_privacy=g('legal_privacy');body.legal_refunds=g('legal_refunds');
      body.schema_json=g('schema_json');
      const st = document.getElementById('scstatus');st.textContent='Saving...';st.className='text-sm ml-2 text-blue-600';
      const r = await API.put('/admin/site',body);
      if(r){st.textContent='Saved! Marketing page regenerated.';st.className='text-sm ml-2 text-green-600'}
      else{st.textContent='Error saving.';st.className='text-sm ml-2 text-red-600'}
    };
  }).catch(() => el.innerHTML='<p class="text-red-500">Not available.</p>');
}

  const sethp = (k, v) => { if (!st.data.homepage) st.data.homepage = {}; st.data.homepage[k] = v; renderApp(); };
  const save = async () => {
    if (!st.data) return;
    st.saving = true; st.status = 'Saving...'; renderApp();
    try {
      const body = { ...st.data };
      body.homepage = st.data.homepage || {};
      await API.put('/admin/site', body);
      st.status = 'Saved! Marketing page regenerated.';
    } catch(e) { st.status = 'Error saving: ' + e.message; }
    st.saving = false; renderApp();
  };
  const d = st.data;
  const field = (k, label, ta) => html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${label}</label>${ta
    ? html`<textarea class="input" rows="3" value=${d[k]||''} onInput=${e => set(k, e.target.value)}></textarea>`
    : html`<input class="input" value=${d[k]||''} onInput=${e => set(k, e.target.value)} />`}</div>`;
  const hpfield = (k, label, ta) => html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${label}</label>${ta
    ? html`<textarea class="input" rows="3" value=${(d.homepage||{})[k]||''} onInput=${e => sethp(k, e.target.value)}></textarea>`
    : html`<input class="input" value=${(d.homepage||{})[k]||''} onInput=${e => sethp(k, e.target.value)} />`}</div>`;
  if (!st.loaded) return html`<div class="card"><p class="text-gray-500 text-sm">Loading site configuration...</p></div>`;
  if (!d) return html`<div class="card"><p class="text-red-500">Site configuration not available.</p></div>`;
  return html`<div>
    <div class="flex items-center justify-between mb-4">
      <div><h2 class="text-xl font-bold">Site Config</h2><p class="text-sm text-gray-500">SEO, analytics, homepage & legal content</p></div>
      <button class="bg-blue-600 text-white px-4 py-2 rounded text-sm" onClick=${save}>${st.saving ? 'Saving...' : 'Save Site Configuration'}</button>
    </div>
    ${st.status ? html`<div class="text-sm mb-3 ${st.status.startsWith('Error') ? 'text-red-600' : 'text-green-600'}">${st.status}</div>` : null}
    <div class="card"><h3 class="font-semibold mb-3">🔍 SEO & Meta</h3>
      ${field('title','Page Title')}${field('description','Meta Description',1)}${field('keywords','Keywords',1)}
      ${field('canonical_url','Canonical URL')}${field('og_title','OG Title')}${field('og_description','OG Description',1)}
      ${field('og_image_url','OG Image URL')}${field('favicon_url','Favicon URL')}
    </div>
    <div class="card"><h3 class="font-semibold mb-3">📊 Analytics & Tracking</h3>
      ${field('ga_id','Google Analytics ID')}${field('gtm_id','Google Tag Manager ID')}
      ${field('head_scripts','Head Scripts',1)}${field('body_scripts','Body Scripts',1)}
    </div>
    <div class="card"><h3 class="font-semibold mb-3">🏠 Homepage</h3>
      ${hpfield('logo_text','Logo Text')}${hpfield('headline','Headline',1)}
      ${hpfield('subheadline','Subheadline',1)}${hpfield('button_text','CTA Button')}${hpfield('secondary_button_text','Secondary Button')}
    </div>
    <div class="card"><h3 class="font-semibold mb-3">⚖️ Legal Pages</h3>
      <p class="text-xs text-gray-400 mb-2">Rendered at /terms.html, /privacy.html, /refunds.html</p>
      ${field('legal_tos','Terms of Service',1)}${field('legal_privacy','Privacy Policy',1)}${field('legal_refunds','Refund & Cancellation Policy',1)}
    </div>
    <div class="card"><h3 class="font-semibold mb-3">📋 Structured Data</h3>
      ${field('schema_json','Schema.org JSON',1)}

  </div>`;

const CalendarEvents = () => {
  const st = viewState('calendar', { list: [], showModal: false, form: { title:'', description:'', starts_at:'', event_type:'event', all_day:false } });
  const load = async () => { try { const d = await API.get('/calendar-events'); st.list = Array.isArray(d.events) ? d.events : []; renderApp(); } catch(e){ console.error(e); } };
  if (!st._loaded) { st._loaded = true; load(); }
  const openNew = () => { st.form = { title:'', description:'', starts_at:'', event_type:'event', all_day:false }; st.showModal = true; renderApp(); };
  const create = async () => { if(!st.form.title||!st.form.starts_at) return alert('Title and start time required'); try { await API.post('/calendar-events', { ...st.form, starts_at: new Date(st.form.starts_at).toISOString() }); st.showModal=false; load(); } catch(e){ alert('Error: '+e.message); } };
  const setStatus = async (id, status) => { try { await API.put('/calendar-events/'+id, { status }); load(); } catch(e){ alert(e.message); } };
  const remove = async (id) => { if(!confirm('Delete this event?')) return; await API.del('/calendar-events/'+id); load(); };
  const fmt = (d) => d ? new Date(d).toLocaleString() : '—';
  const icon = (t) => ({event:'📅', reminder:'⏰', appointment:'📌'}[t] || '📅');
  const badge = (s) => s==='confirmed'?'badge badge-green':s==='cancelled'?'badge badge-red':s==='completed'?'badge badge-blue':'badge badge-yellow';
  const sorted = [...st.list].sort((a,b) => new Date(a.starts_at) - new Date(b.starts_at));
  const upcoming = sorted.filter(e => e.status!=='cancelled' && e.status!=='completed' && new Date(e.starts_at) >= new Date());
  const past = sorted.filter(e => e.status==='completed' || new Date(e.starts_at) < new Date());
  return html`<div>
    <div class="flex items-center justify-between mb-4">
      <div><h2 class="text-xl font-bold">Calendar Events</h2><p class="text-sm text-gray-500">Schedule and track events</p></div>

      <div class="stat-card"><div class="stat-value">${past.length}</div><div class="stat-label">Past / Completed</div></div>
      <div class="stat-card"><div class="stat-value">${st.list.filter(e=>e.status==='confirmed').length}</div><div class="stat-label">Confirmed</div></div>

        <tbody>${sorted.map(e => html`<tr class="${new Date(e.starts_at) < new Date() && e.status!=='completed' ? 'opacity-50' : ''}">
          <td>${icon(e.event_type)}</td>
          <td class="text-sm font-medium">${e.title}</td>
          <td class="text-sm capitalize text-gray-500">${e.event_type}</td>
          <td class="text-sm text-gray-500">${fmt(e.starts_at)}</td>
          <td><span class=${badge(e.status)}>${e.status}</span></td>
          <td class="text-right">
            ${e.status==='scheduled' ? html`<button class="text-green-600 text-sm mr-2" onClick=${() => setStatus(e.id,'confirmed')}>Confirm</button>` : null}
            ${e.status!=='completed' ? html`<button class="text-blue-600 text-sm mr-2" onClick=${() => setStatus(e.id,'completed')}>Complete</button>` : null}
            ${e.status!=='cancelled' ? html`<button class="text-red-600 text-sm mr-2" onClick=${() => setStatus(e.id,'cancelled')}>Cancel</button>` : null}
            <button class="text-red-600 text-sm" onClick=${() => remove(e.id)}>Delete</button>
          </td>
        </tr>`)}
        ${!sorted.length ? html`<tr><td colspan="6" class="text-center text-gray-400 py-8">No events yet</td></tr>` : null}
        </tbody></table>
    </div>
    ${st.showModal ? html`<div class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50" onClick=${() => { st.showModal=false; renderApp(); }}>
      <div class="bg-white rounded-xl p-6 w-[480px] shadow-xl" onClick=${e => e.stopPropagation()}>
        <h3 class="font-bold mb-4">New Event</h3>
        <div class="space-y-3">
          <div><label class="block text-xs font-medium mb-1">Title *</label><input class="border rounded px-3 py-2 w-full text-sm" value=${st.form.title} onInput=${e => { st.form.title=e.target.value; renderApp(); }} /></div>
          <div><label class="block text-xs font-medium mb-1">Description</label><textarea class="border rounded px-3 py-2 w-full text-sm" rows="2" value=${st.form.description} onInput=${e => { st.form.description=e.target.value; renderApp(); }}></textarea></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-xs font-medium mb-1">Type</label><select class="border rounded px-3 py-2 w-full text-sm" value=${st.form.event_type} onInput=${e => { st.form.event_type=e.target.value; renderApp(); }}>${['event','reminder','appointment'].map(x => html`<option>${x}</option>`)}</select></div>
            <div><label class="block text-xs font-medium mb-1">Starts *</label><input type="datetime-local" class="border rounded px-3 py-2 w-full text-sm" value=${st.form.starts_at} onInput=${e => { st.form.starts_at=e.target.value; renderApp(); }} /></div>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button class="px-4 py-1.5 text-sm rounded border" onClick=${() => { st.showModal=false; renderApp(); }}>Cancel</button>
          <button class="px-4 py-1.5 text-sm rounded bg-blue-600 text-white" onClick=${create}>Save</button>
        </div>
      </div>

const OpsAction = ({ act }) => {
  const [v, setV] = useState({});
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true); setRes(null);
    try {
      let path = act.path;
      (act.fields || []).forEach(f => { if (path.indexOf(':' + f) >= 0) path = path.replace(':' + f, encodeURIComponent((v[f] || '').trim())); });
      if (path.indexOf(':') >= 0) throw new Error('missing path parameter: ' + path);
      let body;
      if (act.json) { body = JSON.parse((v.json || '{}').trim() || '{}'); }
      else if (act.method === 'GET' || act.method === 'DELETE') { body = undefined; }
      else {
        body = {};
        (act.fields || []).forEach(f => {
          if (path.indexOf(':' + f) >= 0) return;
          const s = (v[f] || '').trim();
          if (s === '') return;
          body[f] = (act.numeric || []).indexOf(f) >= 0 ? Number(s) : s;
        });
      }
      const r = act.method === 'GET' ? await OPSAPI.get(path)
        : act.method === 'POST' ? await OPSAPI.post(path, body || {})
        : act.method === 'PUT' ? await OPSAPI.put(path, body || {})
        : await OPSAPI.del(path);
      setRes({ ok: true, text: JSON.stringify(r, null, 1).slice(0, 3000) });
    } catch (e) { setRes({ ok: false, text: String((e && e.message) || e) }); }
    setBusy(false);
  };
  return html`<div class="ops-action border rounded-lg p-2 mb-2 bg-gray-50">
    <div class="flex flex-wrap gap-2 items-end">
      ${(act.fields || []).map(f => html`<label class="text-xs text-gray-600 flex flex-col">
        <span>${f}</span>
        <input class="border rounded px-2 py-1 text-sm ops-f-${f}" style=${f === 'json' ? 'min-width:420px;font-family:monospace' : ''}
          value=${v[f] || ''} onInput=${e => setV(s => Object.assign({}, s, { [f]: e.target.value }))} />
      </label>`)}
      <button class="px-3 py-1 rounded bg-indigo-600 text-white text-sm disabled:opacity-50" disabled=${busy} onClick=${go}>
        ${busy ? '...' : (act.label || act.method)}</button>
      ${res && html`<span class="text-xs ${res.ok ? 'text-green-700' : 'text-red-600'}">${res.ok ? 'OK' : 'ERROR'}</span>`}
    </div>
    <div class="text-xs text-gray-500 mt-1"><code>${act.method} /api/v1${act.path}</code></div>
    ${res && html`<pre class="text-xs bg-white border rounded p-2 mt-1 overflow-auto" style="max-height:200px">${res.text}</pre>`}
  </div>`;
};

const OpsList = ({ path }) => {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = async () => {
    setBusy(true); setErr(null);
    try { setData(await OPSAPI.get(path)); } catch (e) { setErr(String((e && e.message) || e)); }
    setBusy(false);
  };
  useEffect(() => { load(); }, []);
  let rows = null;
  if (Array.isArray(data)) rows = data;
  else if (data && typeof data === 'object') {
    const k = Object.keys(data).find(kk => Array.isArray(data[kk]));
    if (k) rows = data[k];
  }
  let body;
  if (err) body = html`<div class="text-xs text-red-600">${err}</div>`;
  else if (!data) body = html`<div class="text-xs text-gray-400">loading...</div>`;
  else if (rows) {
    const cols = Array.from(rows.slice(0, 5).reduce((a, r) => { if (r && typeof r === 'object') Object.keys(r).forEach(k => a.add(k)); return a; }, new Set())).slice(0, 12);
    body = html`<div class="text-xs text-gray-500 mb-1">${rows.length} row(s)</div>
      <div class="overflow-auto" style="max-height:260px"><table class="ops-table text-xs w-full border-collapse">
        <thead><tr>${cols.map(c => html`<th class="text-left border-b px-2 py-1 bg-gray-100">${c}</th>`)}</tr></thead>
        <tbody>${rows.slice(0, 50).map(r => html`<tr>${cols.map(c => html`<td class="border-b px-2 py-1 align-top">${r && r[c] != null ? String(typeof r[c] === 'object' ? JSON.stringify(r[c]) : r[c]).slice(0, 80) : ''}</td>`)}</tr>`)}</tbody>
      </table></div>`;
  } else {
    body = html`<pre class="text-xs bg-white border rounded p-2 overflow-auto" style="max-height:200px">${JSON.stringify(data, null, 1).slice(0, 3000)}</pre>`;
  }
  return html`<div class="ops-list mb-2">
    <div class="flex items-center gap-2 mb-1">
      <code class="text-xs text-gray-500">GET /api/v1${path}</code>
      <button class="px-2 py-0.5 rounded border text-xs" disabled=${busy} onClick=${load}>${busy ? '...' : 'reload'}</button>
    </div>${body}</div>`;
};
