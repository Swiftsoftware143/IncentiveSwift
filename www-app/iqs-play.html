<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualifying Survey</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232736;--border:#2d3248;--text:#e1e4ed;--text2:#8b8fa3;--accent:#a78bfa;--accent2:#c4b5fd;--green:#34d399;--red:#ef4444;--yellow:#fbbf24;--radius:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:640px;width:100%}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:20px}
.card-header{margin-bottom:24px}
.card-header h1{font-size:28px;font-weight:700;margin-bottom:8px}
.card-header p{color:var(--text2);font-size:15px;line-height:1.5}

/* Progress bar */
.progress{height:6px;background:var(--surface2);border-radius:3px;margin-bottom:32px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s ease}
.progress-text{text-align:right;font-size:12px;color:var(--text2);margin-top:6px}

/* Question */
.question-label{font-size:13px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.question-text{font-size:18px;font-weight:600;margin-bottom:20px;line-height:1.4}
.question-required{color:var(--red);margin-left:4px}

/* Fields */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.form-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:var(--radius);font-size:15px;width:100%;transition:border-color .2s}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-input.error{border-color:var(--red)}
.error-text{color:var(--red);font-size:12px;margin-top:4px;display:none}
.error-text.show{display:block}
textarea.form-input{resize:vertical;min-height:80px;font-family:var(--font)}

/* Phone input with country code */
.phone-wrapper{display:flex;gap:8px}
.country-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 10px;border-radius:var(--radius);font-size:14px;min-width:90px;cursor:pointer}
.country-select:focus{outline:none;border-color:var(--accent)}
.phone-input{flex:1}

/* Slider */
.slider-wrapper{display:flex;align-items:center;gap:12px}
.form-slider{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:4px;background:var(--border);outline:none}
.form-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.form-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--surface)}
.slider-value{min-width:36px;text-align:center;font-weight:700;font-size:16px;color:var(--accent);background:var(--surface2);padding:2px 10px;border-radius:6px}

/* Image Choice */
.image-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.image-choice-item{border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;text-align:center}
.image-choice-item:hover{border-color:var(--accent2);transform:translateY(-1px)}
.image-choice-item.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.image-choice-img{width:100%;height:100px;object-fit:cover;display:block}
.image-choice-placeholder{height:100px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--surface2)}
.image-choice-label{padding:8px 6px;font-size:13px;font-weight:500}

/* Matrix / Grid */
.matrix-table-wrapper{overflow-x:auto}
.matrix-table{width:100%;border-collapse:collapse;font-size:13px}
.matrix-table th,.matrix-table td{padding:8px 12px;text-align:center;border:1px solid var(--border)}
.matrix-table th{background:var(--surface2);font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.matrix-row-label{text-align:left;font-weight:500;white-space:nowrap;color:var(--text)}
.matrix-cell{cursor:pointer;transition:background .15s}
.matrix-cell:hover{background:rgba(167,139,250,.1)}
.matrix-cell.selected{background:rgba(167,139,250,.15)}
.matrix-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);margin:0 auto;transition:all .2s;display:flex;align-items:center;justify-content:center}
.matrix-radio.selected{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.matrix-radio.selected::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}

/* Rating stars */
.rating-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rating-star{width:48px;height:48px;border-radius:12px;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .2s;color:var(--text2)}
.rating-star:hover{border-color:var(--accent);color:var(--accent)}
.rating-star.selected{background:rgba(167,139,250,.2);border-color:var(--accent);color:#fbbf24}
.rating-label{font-size:12px;color:var(--text2);text-align:center;margin-top:4px}

/* Date picker */
.date-input{appearance:none;-webkit-appearance:none}
.date-input::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}

/* File upload */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(167,139,250,.05)}
.upload-zone.has-file{border-color:var(--green);background:rgba(52,211,153,.05)}
.upload-icon{font-size:36px;margin-bottom:8px}
.upload-text{color:var(--text2);font-size:14px}
.upload-text strong{color:var(--text)}
.upload-filename{color:var(--green);font-weight:600;font-size:14px;margin-top:4px}
.upload-progress{margin-top:12px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.upload-progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s}
.upload-error{color:var(--red);font-size:13px;margin-top:8px}

/* Consent checkbox */
.consent-wrapper{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)}
.consent-checkbox{width:22px;height:22px;min-width:22px;border-radius:4px;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:2px}
.consent-checkbox.checked{background:var(--accent);border-color:var(--accent)}
.consent-checkbox.checked::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.consent-label{font-size:14px;line-height:1.5;color:var(--text);cursor:pointer}

/* Select dropdown */
.form-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:var(--radius);font-size:15px;width:100%;cursor:pointer;appearance:auto}
.form-select:focus{outline:none;border-color:var(--accent)}

/* Number input */
.number-input-wrapper{display:flex;align-items:center;gap:8px}
.number-input{max-width:120px;text-align:center}
.number-unit{color:var(--text2);font-size:14px}

/* Choice options */
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s;text-align:left;font-size:15px;color:var(--text);width:100%}
.option-btn:hover{border-color:var(--accent);background:rgba(167,139,250,.08)}
.option-btn.selected{border-color:var(--accent);background:rgba(167,139,250,.12);box-shadow:0 0 0 1px var(--accent)}
.option-indicator{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.option-btn.selected .option-indicator{border-color:var(--accent);background:var(--accent)}
.option-btn.selected .option-indicator::after{content:'✓';color:#fff;font-size:12px;font-weight:700}

/* Buttons */
.btn-group{display:flex;gap:12px;margin-top:24px;justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;border:none;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--border)}
.btn-secondary:disabled{opacity:.4;cursor:not-allowed}
.btn-block{width:100%}

/* Result page */
.result-icon{font-size:64px;text-align:center;margin-bottom:16px}
.result-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px}
.result-subtitle{color:var(--text2);text-align:center;font-size:15px;margin-bottom:24px;line-height:1.5}
.result-detail{display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.detail-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:13px}
.detail-chip .chip-label{color:var(--text2);margin-right:4px}
.detail-chip .chip-value{color:var(--accent);font-weight:600}
.tag-list{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.tag{background:rgba(167,139,250,.15);color:var(--accent2);border-radius:12px;padding:4px 12px;font-size:12px}

/* Loading spinner */
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:32px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Contact form */
.contact-form{margin-bottom:20px}

/* Animations */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:480px){
  .card{padding:20px}
  .card-header h1{font-size:22px}
  .phone-wrapper{flex-direction:column}
}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const API_BASE = window.location.origin + '/api/v1';

// Route
const path = window.location.pathname;
const match = path.match(/^\/iqs\/play\/([^/]+)/);

if (!match) {
  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align:center;padding:48px">
      <div style="font-size:48px;margin-bottom:16px">🔍</div>
      <h2>Survey Not Found</h2>
      <p style="color:var(--text2);margin-top:8px">No qualifying survey slug was provided.</p>
    </div>`;
} else {
  const SLUG = match[1];
  let state = { funnel: null, questions: [], currentStep: 0, answers: {}, contact: {}, submitted: false, submitting: false, result: null, error: null };

  const appEl = document.getElementById('app');

  function render() {
    if (state.error) return renderError();
    if (!state.funnel) return renderLoading('Loading survey...');
    if (state.submitted && state.result) return renderResult();

    const f = state.funnel;
    const qs = state.questions;
    const step = state.currentStep;

    // If we haven't collected contact info yet, show that first
    if (step < 0) return renderContactForm();

    // Display mode check
    const isAllAtOnce = f.config && f.config.display_mode === 'all_at_once';

    if (isAllAtOnce) {
      return renderAllAtOnce();
    }

    // If we're past all questions, show review
    if (step >= qs.length) return renderReview();

    const q = qs[step];
    const progress = ((step) / qs.length) * 100;

    appEl.innerHTML = `
      <div class="card fade-in">
        <div class="card-header">
          <h1>${escHtml(f.name)}</h1>
          ${f.description ? `<p>${escHtml(f.description)}</p>` : ''}
        </div>
        ${f.config.show_progress_bar ? `
        <div class="progress">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
        <div class="progress-text">Question ${step+1} of ${qs.length}</div>
        ` : ''}
        <div class="progress" style="margin-bottom:24px">
          <div class="progress-fill" style="width:${((step) / qs.length) * 100}%"></div>
        </div>
        <div id="q-container-${q.id}" style="${q.config && q.config.show_if ? 'display:none' : ''}">
          <div class="question-label">Question ${step+1} of ${qs.length}</div>
          <div class="question-text">${escHtml(q.question_text)}${q.required ? '<span class="question-required">*</span>' : ''}</div>
          <div id="question-body"></div>
          <div id="question-error" class="error-text"></div>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="prevStep()" ${step === 0 ? 'disabled' : ''}>← Back</button>
          <button class="btn btn-primary" onclick="nextStep()">${step === qs.length-1 ? 'Review' : 'Next →'}</button>
        </div>
      </div>`;

    renderQuestion(q);
    if (state.answers[q.id]) {
      const el = document.querySelector('.option-btn.selected') || document.querySelector(`[data-value="${state.answers[q.id]}"]`);
      if (el) el.classList.add('selected');
    }
    // Re-evaluate show_if conditions
    setTimeout(function() { reEvaluateShowIf(); }, 50);
  }

  function renderContactForm() {
    const f = state.funnel;
    const config = f.config || {};

    appEl.innerHTML = `
      <div class="card fade-in">
        <div class="card-header">
          <h1>${escHtml(f.name)}</h1>
          ${f.description ? `<p>${escHtml(f.description)}</p>` : ''}
        </div>
        <p style="color:var(--text2);margin-bottom:20px">Please tell us a bit about yourself to get started.</p>
        <div class="contact-form">
          ${config.collect_name ? `
          <div class="form-group">
            <label>First Name${config.collect_name === 'required' ? '<span class="question-required">*</span>' : ''}</label>
            <input class="form-input" id="field-first_name" placeholder="Your first name" value="${escHtml(state.contact.first_name||'')}">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input class="form-input" id="field-last_name" placeholder="Your last name" value="${escHtml(state.contact.last_name||'')}">
          </div>` : ''}
          ${config.collect_email ? `
          <div class="form-group">
            <label>Email${config.collect_email === 'required' ? '<span class="question-required">*</span>' : ''}</label>
            <input class="form-input" id="field-email" type="email" placeholder="you@example.com" value="${escHtml(state.contact.email||'')}">
            <div class="error-text" id="error-email"></div>
          </div>` : ''}
          ${config.collect_phone ? `
          <div class="form-group">
            <label>Phone${config.collect_phone === 'required' ? '<span class="question-required">*</span>' : ''}</label>
            <div class="phone-wrapper">
              <select class="country-select" id="field-country">
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+1">🇨🇦 +1</option>
                <option value="+61">🇦🇺 +61</option>
                <option value="+49">🇩🇪 +49</option>
                <option value="+33">🇫🇷 +33</option>
                <option value="+39">🇮🇹 +39</option>
                <option value="+34">🇪🇸 +34</option>
                <option value="+55">🇧🇷 +55</option>
                <option value="+52">🇲🇽 +52</option>
              </select>
              <input class="form-input phone-input" id="field-phone" type="tel" placeholder="(555) 123-4567" value="${escHtml(state.contact.phone||'')}">
            </div>
            <div class="error-text" id="error-phone"></div>
          </div>` : ''}
        </div>
        <button class="btn btn-primary btn-block" onclick="startSurvey()">Start Survey →</button>
      </div>`;
  }

  function renderQuestion(q, containerId) {
    const body = containerId ? document.getElementById(containerId) : document.getElementById('question-body');
    if (!body) return;

    const type = q.question_type || 'single_choice';
    const cfg = q.config || {};
    // Prefix for element IDs when rendering in all-at-once mode (to avoid collisions)
    const pfx = containerId ? (containerId + '-') : '';
    const fid = function(id){ return pfx + id; };

    if (type === 'field_email') {
      body.innerHTML = `
        <div class="form-group">
          <input class="form-input" id="${fid('field-val')}" type="email" placeholder="you@example.com" value="${escHtml(state.answers[q.id]||'')}">
          <div class="error-text" id="${fid('field-error')}"></div>
        </div>`;

    } else if (type === 'field_phone') {
      const ccDefault = cfg.country_code_default || 'US';
      body.innerHTML = `
        <div class="form-group">
          <div class="phone-wrapper">
            <select class="country-select" id="${fid('field-country')}">
              <option value="+1" ${ccDefault==='US'||ccDefault==='CA'?'selected':''}>🇺🇸🇨🇦 +1</option>
              <option value="+44" ${ccDefault==='GB'?'selected':''}>🇬🇧 +44</option>
              <option value="+61" ${ccDefault==='AU'?'selected':''}>🇦🇺 +61</option>
              <option value="+49" ${ccDefault==='DE'?'selected':''}>🇩🇪 +49</option>
              <option value="+33" ${ccDefault==='FR'?'selected':''}>🇫🇷 +33</option>
              <option value="+39" ${ccDefault==='IT'?'selected':''}>🇮🇹 +39</option>
              <option value="+34" ${ccDefault==='ES'?'selected':''}>🇪🇸 +34</option>
              <option value="+55" ${ccDefault==='BR'?'selected':''}>🇧🇷 +55</option>
              <option value="+52" ${ccDefault==='MX'?'selected':''}>🇲🇽 +52</option>
            </select>
            <input class="form-input phone-input" id="${fid('field-val')}" type="tel" placeholder="(555) 123-4567" value="${escHtml(stripCountryCode(state.answers[q.id]||''))}">
          </div>
          <div class="error-text" id="${fid('field-error')}"></div>
        </div>`;
      if (state.answers[q.id]) {
        const prevVal = state.answers[q.id];
        const countryEl = document.getElementById(fid('field-country'));
        if (countryEl) {
          for (const opt of countryEl.options) {
            if (prevVal.startsWith(opt.value)) { opt.selected = true; break; }
          }
        }
      }

    } else if (type === 'field_url') {
      body.innerHTML = `
        <div class="form-group">
          <input class="form-input" id="${fid('field-val')}" type="url" placeholder="https://example.com" value="${escHtml(state.answers[q.id]||'')}">
          <div class="error-text" id="${fid('field-error')}"></div>
        </div>`;

    } else if (type === 'field_number') {
      const min = cfg.min !== undefined ? cfg.min : '';
      const max = cfg.max !== undefined ? cfg.max : '';
      const step = cfg.step !== undefined ? cfg.step : 'any';
      const unit = cfg.unit || '';
      body.innerHTML = `
        <div class="form-group">
          <div class="number-input-wrapper">
            <input class="form-input number-input" id="${fid('field-val')}" type="number"
                   min="${min}" max="${max}" step="${step}"
                   placeholder="${min !== '' ? min : '0'}"
                   value="${escHtml(state.answers[q.id]||'')}">
            ${unit ? `<span class="number-unit">${escHtml(unit)}</span>` : ''}
          </div>
          ${min !== '' && max !== '' ? `<div style="font-size:12px;color:var(--text2);margin-top:4px">Range: ${min} – ${max}</div>` : ''}
          <div class="error-text" id="${fid('field-error')}"></div>
        </div>`;

    } else if (type === 'field_rating') {
      const maxRating = cfg.max_rating || 5;
      const current = parseInt(state.answers[q.id] || '0');
      body.innerHTML = `
        <div class="form-group">
          <div class="rating-group" id="${fid('rating-group')}">
            ${Array.from({length: maxRating}, (_, i) => `
              <div class="rating-star ${i < current ? 'selected' : ''}" data-val="${i+1}"
                   onclick="setRatingFor(${i+1},'${pfx}')"
                   onmouseenter="hoverRatingFor(${i+1},'${pfx}')"
                   onmouseleave="unhoverRatingFor(${current},'${pfx}')">
                ${i < current ? '★' : '☆'}
              </div>`).join('')}
          </div>
          <div class="rating-label" id="${fid('rating-label')}">${current > 0 ? current + ' / ' + maxRating : 'Tap to rate'}</div>
          <div class="error-text" id="${fid('field-error')}"></div>
        </div>`;

    } else if (type === 'field_date') {
      const includeTime = cfg.include_time;
      const val = state.answers[q.id] || '';
      body.innerHTML = `
        <div class="form-group">
          <input class="form-input date-input" id="${fid('field-val')}" type="${includeTime ? 'datetime-local' : 'date'}" value="${escHtml(formatDateForInput(val, includeTime))}">
          <div class="error-text" id="${fid('field-error')}"></div>
        </div>`;

    } else if (type === 'field_file') {
      const allowedExts = (cfg.allowed_extensions || []).join(', ');
      const maxSize = cfg.max_size_mb || 10;
      const fileId = fid('file-input');
      body.innerHTML = `
        <div class="form-group">
          <div class="upload-zone ${state.answers[q.id] ? 'has-file' : ''}" id="${fid('upload-zone')}"
               onclick="document.getElementById('${fileId}').click()"
               ondragover="event.preventDefault();this.classList.add('dragover')"
               ondrop="handleFileDropFor(event, '${q.id}', '${pfx}')">
            ${state.answers[q.id]
              ? `<div class="upload-icon">✅</div><div class="upload-filename">${escHtml(state.answers[q.id].split('/').pop())}</div>`
              : `<div class="upload-icon">📁</div><div class="upload-text">Drop a file here or <strong>click to browse</strong></div><div class="upload-text" style="font-size:12px;margin-top:4px">Max ${maxSize}MB${allowedExts ? ' · ' + allowedExts : ''}</div>`}
          </div>

    } else if (type === 'field_consent') {

                ${o.image_url ? `<img src="${escHtml(o.image_url)}" alt="${escHtml(o.label || o.value)}" class="image-choice-img">` : `<div class="image-choice-placeholder">📷</div>`}

        </div>`;

    } else if (type === 'field_matrix') {
      const rows = cfg.rows || [];
      const cols = cfg.columns || [];
      const matrixVal = state.answers[q.id] ? JSON.parse(state.answers[q.id]) : {};
      body.innerHTML = `

                <tr>
                  <td class="matrix-row-label">${escHtml(r.label || r.key)}</td>
                  ${cols.map(c => `
                    <td class="matrix-cell" onclick="(function(){const key='${escHtml(r.key)}';const val='${escHtml(c.value)}';const m=state.answers['${q.id}']?JSON.parse(state.answers['${q.id}']):{};m[key]=val;state.answers['${q.id}']=JSON.stringify(m);const td=event.currentTarget;td.closest('tr').querySelectorAll('.matrix-cell').forEach(c=>c.classList.remove('selected'));td.classList.add('selected')})()">
                      <div class="matrix-radio ${(matrixVal[r.key] === c.value) ? 'selected' : ''}"></div>

            </table>
          </div>
          <div class="error-text" id="${fid('field-error')}"></div>
        </div>`;
      // Restore selected state after render
      setTimeout(() => {
        if (Object.keys(matrixVal).length) {
          const container = document.getElementById(fid('field-val'))?.closest('.form-group');
          if (container) {
            Object.entries(matrixVal).forEach(([rk, rv]) => {
              const cells = container.querySelectorAll('.matrix-cell');
              // Find matching cell
            });
          }
        }
      }, 0);

    } else if (type === 'field_select') {
      const opts = cfg.options || q.options || [];
      body.innerHTML = `
        <div class="form-group">
          <select class="form-select" id="${fid('field-val')}" onchange="state.answers['${q.id}']=this.value">
            <option value="">— Select —</option>
            ${opts.map(o => `<option value="${escHtml(o.value)}" ${state.answers[q.id] === o.value ? 'selected' : ''}>${escHtml(o.label || o.value)}</option>`).join('')}
          </select>
          <div class="error-text" id="${fid('field-error')}"></div>

    } else if (type === 'field_text' || type === 'field_textarea') {
      body.innerHTML = `
        <div class="form-group">
          ${type === 'field_textarea'
            ? `<textarea class="form-input" id="${fid('field-val')}" rows="4" placeholder="Your answer...">${escHtml(state.answers[q.id]||'')}</textarea>`
            : `<input class="form-input" id="${fid('field-val')}" type="text" placeholder="Your answer..." value="${escHtml(state.answers[q.id]||'')}">`}
        </div>`;

    } else {
      // Choice-type questions (single_choice, multiple_choice)
      const opts = q.options || [];

      const selectedArr = selected ? selected.split(',') : [];

      const choicesContainerId = fid('choices');
      body.innerHTML = `<div class="options">${
        opts.map((o, i) => `
          <div class="option-btn ${isMulti ? (selectedArr.includes(o.value) ? 'selected' : '') : (selected === o.value ? 'selected' : '')}"

  function renderAllAtOnce() {
    const f = state.funnel;
    const qs = state.questions;
    appEl.innerHTML = `
      <div class="card fade-in">
        <div class="card-header">
          <h1>${escHtml(f.name)}</h1>
          ${f.description ? `<p>${escHtml(f.description)}</p>` : ''}
        </div>
        <p style="color:var(--text2);margin-bottom:20px;font-size:14px">Answer all questions below, then click Submit.</p>
        <div id="all-questions-list">
          ${qs.map((q, i) => `
            <div id="q-container-${q.id}" style="margin-bottom:20px;padding:16px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);transition:opacity 0.3s ease;${q.config && q.config.show_if ? 'display:none' : ''}">
              <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Question ${i+1}${q.required ? ' <span style="color:var(--red)">*</span>' : ''}</div>
              <div style="font-weight:600;margin-bottom:12px;font-size:15px">${escHtml(q.question_text)}</div>
              <div id="q-${i}-body"></div>
              <div class="error-text" id="q-${i}-error"></div>
            </div>
          `).join('')}
        </div>
        <button class="btn btn-primary btn-block" onclick="submitAllAtOnce()">Submit →</button>
      </div>`;
    // Render each question inline
    qs.forEach((q, i) => {
      const savedStep = state.currentStep;
      state.currentStep = i;
      renderQuestion(q, 'q-' + i + '-body');
      state.currentStep = savedStep;
    });
    // Re-evaluate show_if conditions
    setTimeout(function() { reEvaluateShowIf(); }, 50);
  }

  window.submitAllAtOnce = async function() {
    // Collect all answers from rendered fields
    const qs = state.questions;
    qs.forEach((q, i) => {
      const containerId = 'q-' + i + '-body';
      const val = collectAllAtOnceValue(q, i);
      state.answers[q.id] = val || '';
      // Validate required
      if (q.required && !val) {
        const errEl = document.getElementById('q-' + i + '-error');
        if (errEl) { errEl.textContent = 'This question is required'; errEl.classList.add('show'); }
      }
    });
    // If any required missing, abort
    const missing = qs.filter((q, i) => q.required && !state.answers[q.id]);
    if (missing.length) {
      alert('Please answer all required questions');
      return;
    }
    // Submit
    state.submitting = true;
    const answers = qs.map(q => ({ question_id: q.id, value: state.answers[q.id] || '' }));
    const body = { contact: state.contact, answers };
    try {
      const res = await fetch(API_BASE + '/iqs/play/' + SLUG + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Submission failed');
      state.result = data.data;
      state.submitted = true;
      state.submitting = false;
      render();
      autoRedirectAfterSubmit();
    } catch (err) {
      state.submitting = false;
      state.error = err.message;
      render();
    }
  };

  function collectAllAtOnceValue(q, idx) {
    const type = q.question_type;
    const containerId = 'q-' + idx + '-body';
    if (type === 'field_phone') {
      const cc = document.querySelector('#' + containerId + ' .country-select')?.value || '+1';
      const phone = document.querySelector('#' + containerId + ' .phone-input')?.value?.trim() || '';
      return phone.startsWith('+') ? phone : cc + phone.replace(/[^0-9]/g, '');
    }
    if (type === 'field_consent') {
      return document.querySelector('#' + containerId + ' .consent-checkbox')?.classList.contains('checked') ? 'true' : '';
    }
    if (type === 'field_rating') {
      const selected = document.querySelectorAll('#' + containerId + ' .rating-star.selected').length;
      return selected ? String(selected) : '';
    }
    if (type === 'field_select') {
      return document.querySelector('#' + containerId + ' .form-select')?.value || '';
    }
    if (['field_text','field_textarea','field_email','field_url','field_number','field_date'].includes(type)) {
      return document.querySelector('#' + containerId + ' .form-input')?.value?.trim() || '';
    }
    // Choice type
    const selected = document.querySelector('#' + containerId + ' .option-btn.selected');
    return selected ? selected.dataset.value : '';
  }

  function renderReview() {
    const qs = state.questions;

          <p>Please review your answers before submitting.</p>
        </div>
        ${qs.map((q, i) => `
          <div style="margin-bottom:16px;padding:12px;background:var(--surface2);border-radius:var(--radius)">
            <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Question ${i+1}</div>
            <div style="font-weight:600;margin-bottom:6px">${escHtml(q.question_text)}</div>
            <div style="color:var(--accent)">${escHtml(state.answers[q.id] || '(not answered)')}</div>
          </div>

        <div class="btn-group">

          <button class="btn btn-primary" onclick="submitAnswers()" ${state.submitting ? 'disabled' : ''}>

        .detail-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 16px; font-size: 13px; }
        .detail-chip .chip-label { color: var(--text2); margin-right: 4px; }

        .tag-list { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }

        .result-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; border: none; text-decoration: none; background: ${accent}; color: #fff; }
        .result-btn:hover { opacity: .9; }
      </style>
      <div class="result-card fade-in">

        <div class="result-detail">
          <div class="detail-chip"><span class="chip-label">Score:</span><span class="chip-value">${r.score}</span></div>
          <div class="detail-chip"><span class="chip-label">Outcome:</span><span class="chip-value">${escHtml(r.outcome||'')}</span></div>
        </div>
        ${r.tags_applied && r.tags_applied.length ? `

        ` : ''}
        ${redirectUrl ? `<a href="${escHtml(redirectUrl)}" class="result-btn" style="margin-top:16px">Continue →</a>` : ''}

  function hexToRgb(hex) {
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2), 16) || 139;
    const g = parseInt(h.substring(2,4), 16) || 92;
    const b = parseInt(h.substring(4,6), 16) || 246;
    return r + ',' + g + ',' + b;
  }

  function autoRedirectAfterSubmit() {
    const f = state.funnel;
    const ps = (f.config && f.config.post_submit) || {};
    const r = state.result;
    const redirectUrl = r && r.passed
      ? (ps.qualified_redirect_url || null)
      : (ps.disqualified_redirect_url || null);
    if (redirectUrl) {
      setTimeout(function() {
        window.location.href = redirectUrl;
      }, 3000);
    }

        <div style="font-size:48px;margin-bottom:16px">⚠️</div>

      </div>`;

  // Actions
  // Conditional branching: evaluate show_if conditions for a question
  function evaluateShowIf(question, answerMap) {
    if (!question.config || !question.config.show_if) return true;
    const si = question.config.show_if;
    const depAnswer = answerMap[si.depends_on] || '';
    switch (si.operator) {
      case 'equals': return depAnswer === si.value;
      case 'not_equals': return depAnswer !== si.value;
      case 'contains': return depAnswer.indexOf(si.value) !== -1;
      default: return true;
    }
  }

  // Re-evaluate all conditional questions
  function reEvaluateShowIf() {
    const answerMap = {};
    state.questions.forEach(function(q) {
      if (state.answers[q.id]) answerMap[q.id] = state.answers[q.id];
    });
    // Also build key-based map
    const keyMap = {};
    state.questions.forEach(function(q) {
      if (state.answers[q.id]) keyMap[q.question_key] = state.answers[q.id];
    });
    state.questions.forEach(function(q) {
      const el = document.getElementById('q-container-' + q.id);
      if (el && q.config && q.config.show_if) {
        const visible = evaluateShowIf(q, keyMap);
        el.style.display = visible ? '' : 'none';
        el.style.opacity = visible ? '1' : '0';
        el.style.transition = 'opacity 0.3s ease';
        if (visible) {
          setTimeout(function() { el.style.opacity = '1'; }, 10);
        }
      }
    });
  }

  window.startSurvey = function() {
    const f = state.funnel;
    const config = f.config || {};
    const contact = {};

    if (config.collect_name) {
      contact.first_name = document.getElementById('field-first_name')?.value?.trim() || '';
      contact.last_name = document.getElementById('field-last_name')?.value?.trim() || '';
    }
    if (config.collect_email) {
      contact.email = document.getElementById('field-email')?.value?.trim() || '';
      const errEl = document.getElementById('error-email');
      if (!contact.email) {
        errEl.textContent = 'Email is required';
        errEl.classList.add('show');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email)) {
        errEl.textContent = 'Please enter a valid email';
        errEl.classList.add('show');
        return;
      }
    }
    if (config.collect_phone) {
      const countryCode = document.getElementById('field-country')?.value || '+1';
      const phone = document.getElementById('field-phone')?.value?.trim() || '';
      contact.phone = phone.startsWith('+') ? phone : countryCode + phone.replace(/[^0-9]/g, '');
    }

    state.contact = contact;
    state.currentStep = 0;
    render();
  };

  window.selectSingle = function(value) {
    const q = state.questions[state.currentStep];
    state.answers[q.id] = value;
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.classList.toggle('selected', b.dataset.value === value));
  };

  window.toggleMulti = function(value) {
    const q = state.questions[state.currentStep];
    const current = state.answers[q.id] ? state.answers[q.id].split(',') : [];
    const idx = current.indexOf(value);
    if (idx >= 0) current.splice(idx, 1); else current.push(value);
    state.answers[q.id] = current.join(',');
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.classList.toggle('selected', current.includes(b.dataset.value)));
  };

  window.nextStep = function() {
    const q = state.questions[state.currentStep];
    const value = getCurrentValue(q);
    const errEl = document.getElementById('field-error') || document.querySelector('.error-text.show') || document.getElementById('question-error');
    if (!errEl) return;

    const type = q.question_type;

    // Validate required
    if (q.required && !value) {
      errEl.textContent = q.question_type === 'field_consent' ? 'You must agree to proceed' : 'This question is required';
      errEl.classList.add('show');
      return;
    }

    // Client-side field validation
    if (value) {
      if (type === 'field_email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
        errEl.textContent = 'Please enter a valid email address';
        errEl.classList.add('show');
        document.getElementById('field-val')?.classList.add('error');
        return;
      }
      if (type === 'field_phone') {
        const clean = value.replace(/[^0-9+]/g, '');
        if (!/^\+?\d{7,15}$/.test(clean)) {
          errEl.textContent = 'Please enter a valid phone number';
          errEl.classList.add('show');
          return;
        }
      }
      if (type === 'field_url') {
        if (!/^https?:\/\//i.test(value)) {
          errEl.textContent = 'Please enter a valid URL starting with http:// or https://';
          errEl.classList.add('show');
          return;
        }
      }
      if (type === 'field_number') {
        const num = parseFloat(value);
        if (isNaN(num)) {
          errEl.textContent = 'Please enter a valid number';
          errEl.classList.add('show');
          return;
        }
        const cfg = q.config || {};
        if (cfg.min !== undefined && num < cfg.min) {
          errEl.textContent = 'Value must be at least ' + cfg.min;
          errEl.classList.add('show');
          return;
        }
        if (cfg.max !== undefined && num > cfg.max) {
          errEl.textContent = 'Value must be at most ' + cfg.max;
          errEl.classList.add('show');
          return;
        }
      }
      if (type === 'field_date') {
        if (isNaN(Date.parse(value))) {
          errEl.textContent = 'Please enter a valid date';
          errEl.classList.add('show');
          return;
        }
      }
    }

    errEl.classList.remove('show');
    state.answers[q.id] = value || '';
    state.currentStep++;
    render();
  };

  window.prevStep = function() {
    const q = state.questions[state.currentStep];
    const value = getCurrentValue(q);
    state.answers[q.id] = value || '';
    state.currentStep--;
    render();
  };

  function getCurrentValue(q) {
    const type = q.question_type;
    if (type === 'field_phone') {
      const countryCode = document.getElementById('field-country')?.value || '+1';
      const phone = document.getElementById('field-val')?.value?.trim() || '';
      return phone.startsWith('+') ? phone : countryCode + phone.replace(/[^0-9]/g, '');
    }
    if (type === 'field_file') {
      return state.answers[q.id] || '';
    }
    if (type === 'field_consent') {
      return document.getElementById('consent-box')?.classList.contains('checked') ? 'true' : '';
    }
    if (type === 'field_rating') {
      const selected = document.querySelectorAll('.rating-star.selected').length;
      return selected ? String(selected) : '';
    }
    if (type === 'field_select') {
      return document.getElementById('field-val')?.value || '';
    }
    // Standard input fields: text, textarea, email, url, number, date, datetime-local
    if (['field_text','field_textarea','field_email','field_url','field_number','field_date','field_text'].includes(type)) {
      return document.getElementById('field-val')?.value?.trim() || '';
    }
    // Choice type
    const selected = document.querySelector('.option-btn.selected');
    return selected ? selected.dataset.value : '';
  }

  window.submitAnswers = async function() {
    state.submitting = true;
    render();

    // Convert answers to the API format
    const answers = state.questions.map(q => ({
      question_id: q.id,
      value: state.answers[q.id] || ''
    }));

    const body = {
      contact: state.contact,
      answers
    };

    try {
      const res = await fetch(`${API_BASE}/iqs/play/${SLUG}/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Submission failed');
      state.result = data.data;
      state.submitted = true;
      state.submitting = false;
      render();
      autoRedirectAfterSubmit();
    } catch (err) {
      state.submitting = false;
      state.error = err.message;
      render();
    }
  };

  window.setRating = function(val) {
    state.answers[state.questions[state.currentStep].id] = String(val);
    const stars = document.querySelectorAll('.rating-star');
    stars.forEach((s, i) => {
      s.classList.toggle('selected', i < val);
      s.textContent = i < val ? '★' : '☆';
    });
    document.getElementById('rating-label').textContent = val + ' / ' + stars.length;
  };

  window.hoverRating = function(val) {
    const stars = document.querySelectorAll('.rating-star');
    stars.forEach((s, i) => {
      s.textContent = i < val ? '★' : '☆';
      if (i < val) s.style.color = '#fbbf24';
    });
  };

  window.unhoverRating = function(current) {
    const stars = document.querySelectorAll('.rating-star');
    stars.forEach((s, i) => {
      if (i < current) { s.style.color = '#fbbf24'; s.textContent = '★'; }
      else { s.style.color = ''; s.textContent = '☆'; }
    });
  };

  window.toggleConsent = function() {
    const box = document.getElementById('consent-box');
    box.classList.toggle('checked');
    const q = state.questions[state.currentStep];
    state.answers[q.id] = box.classList.contains('checked') ? 'true' : '';
  };

  window.handleFileSelect = async function(ev, qid) {
    const file = ev.target.files[0];
    if (!file) return;
    await uploadFile(file, qid);
  };

  window.handleFileDrop = async function(ev, qid) {
    ev.preventDefault();
    document.getElementById('upload-zone').classList.remove('dragover');
    const file = ev.dataTransfer.files[0];
    if (!file) return;
    await uploadFile(file, qid);
  };

  async function uploadFile(file, qid) {
    const maxSize = 10 * 1024 * 1024;
    if (file.size > maxSize) {
      document.getElementById('upload-error').textContent = 'File exceeds 10MB limit';
      return;
    }

    const progressBar = document.getElementById('upload-progress');
    const progressFill = document.getElementById('upload-progress-fill');
    const uploadError = document.getElementById('upload-error');
    progressBar.style.display = 'block';
    uploadError.textContent = '';

    const formData = new FormData();
    formData.append('file', file);

    try {
      // Upload requires auth token; try public upload endpoint
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);

      // For public submissions, we need a different approach — store filename and upload URL
      // Since this is a public endpoint and file upload requires auth, we'll store the filename
      // and let the system handle it. For now, store as placeholder.
      clearTimeout(timeout);

      // Until we have a proper public upload endpoint, store the filename as reference
      const q = state.questions.find(q => q.id === qid);
      if (q) {
        state.answers[q.id] = '[uploaded] ' + file.name;
      }

      const zone = document.getElementById('upload-zone');
      zone.classList.add('has-file');
      zone.innerHTML = '<div class="upload-icon">✅</div><div class="upload-filename">' + escHtml(file.name) + '</div>';
      progressBar.style.display = 'none';
    } catch (err) {
      if (err.name !== 'AbortError') {
        uploadError.textContent = 'Upload failed: ' + err.message;
      }
    }
  }

  function formatDateForInput(val, includeTime) {
    if (!val) return '';
    if (includeTime && val.includes(' ')) {
      const [d, t] = val.split(' ');
      return d + 'T' + t;
    }
    return val;
  }

  function stripCountryCode(val) {
    if (!val) return '';
    return val.replace(/^\+\d{1,3}/, '');
  }

  function escHtml(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // All-at-once helper functions (with container prefix for unique IDs)
  window.selectSingleFor = function(value, qid, pfx) {
    state.answers[qid] = value;
    reEvaluateShowIf();
    const container = document.querySelector('#' + pfx + 'choices') || document.querySelector('#' + pfx.slice(0,-1) + '-body .options');
    if (container) {
      container.querySelectorAll('.option-btn').forEach(b => b.classList.toggle('selected', b.dataset.value === value));
    }
  };
  window.toggleMultiFor = function(value, qid, pfx) {
    const current = state.answers[qid] ? state.answers[qid].split(',') : [];
    const idx = current.indexOf(value);
    if (idx >= 0) current.splice(idx, 1); else current.push(value);
    state.answers[qid] = current.join(',');
    reEvaluateShowIf();
    const container = document.querySelector('#' + pfx + 'choices') || document.querySelector('#' + pfx.slice(0,-1) + '-body .options');
    if (container) {
      container.querySelectorAll('.option-btn').forEach(b => b.classList.toggle('selected', current.includes(b.dataset.value)));
    }
  };
  window.setRatingFor = function(val, pfx) {
    const q = state.questions[state.currentStep];
    if (q) state.answers[q.id] = String(val);
    const stars = document.querySelectorAll('#' + pfx + 'rating-group .rating-star');
    stars.forEach((s, i) => { s.classList.toggle('selected', i < val); s.textContent = i < val ? '\u2605' : '\u2606'; });
    const label = document.getElementById(pfx + 'rating-label');
    if (label) label.textContent = val + ' / ' + stars.length;
  };
  window.hoverRatingFor = function(val, pfx) {
    const stars = document.querySelectorAll('#' + pfx + 'rating-group .rating-star');
    stars.forEach((s, i) => { s.textContent = i < val ? '\u2605' : '\u2606'; if (i < val) s.style.color = '#fbbf24'; });
  };
  window.unhoverRatingFor = function(current, pfx) {
    const stars = document.querySelectorAll('#' + pfx + 'rating-group .rating-star');
    stars.forEach((s, i) => { if (i < current) { s.style.color = '#fbbf24'; s.textContent = '\u2605'; } else { s.style.color = ''; s.textContent = '\u2606'; } });
  };
  window.toggleConsentFor = function(qid, pfx) {
    const box = document.getElementById(pfx + 'consent-box');
    if (!box) return;
    box.classList.toggle('checked');
    state.answers[qid] = box.classList.contains('checked') ? 'true' : '';
  };
  window.handleFileSelectFor = function(ev, qid, pfx) {
    const file = ev.target.files[0];
    if (!file) return;
    handleFileDropForImpl(file, qid, pfx);
  };
  window.handleFileDropFor = function(ev, qid, pfx) {
    ev.preventDefault();
    const zone = document.getElementById(pfx + 'upload-zone');
    if (zone) zone.classList.remove('dragover');
    const file = ev.dataTransfer.files[0];
    if (!file) return;
    handleFileDropForImpl(file, qid, pfx);
  };
  async function handleFileDropForImpl(file, qid, pfx) {
    state.answers[qid] = '[uploaded] ' + file.name;
    const zone = document.getElementById(pfx + 'upload-zone');
    if (zone) {
      zone.classList.add('has-file');
      zone.innerHTML = '<div class="upload-icon">\u2705</div><div class="upload-filename">' + escHtml(file.name) + '</div>';
    }
    const progressBar = document.getElementById(pfx + 'upload-progress');
    if (progressBar) progressBar.style.display = 'none';
  }

  // Load funnel
  loadFunnel();

  async function loadFunnel() {
    try {
      state.error = null;
      renderLoading('Loading survey...');
      const res = await fetch(`${API_BASE}/iqs/play/${SLUG}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Survey not found');
      state.funnel = data.funnel;
      state.questions = data.questions;
      state.currentStep = -1; // Start with contact form
      render();
    } catch (err) {
      state.error = err.message;
      render();
    }
  }
}
</script>
</body>
</html>
