<!DOCTYPE html>
<html lang="en">
<head>
<!-- SESSION HANDOFF — kanban t_c7ba0473. MUST stay FIRST in <head>, before the AUTH GUARD below.
     This app had two session models and nothing joined them: /login writes localStorage
     'ws_fs_token', while this shell's boot path and /dashboard read sessionStorage
     'is_token'/'is_user'. So a signed-in user was handed to /app and shown THIS login form with
     their token sitting unused in localStorage. The marketing signup pages hand the session over
     as a URL fragment (#token=<jwt>) and nothing read that either.
     This block is the ONE place that adopts a handed-over token and makes the two models agree:
       #token=<jwt>                 -> mirror it into localStorage, strip the fragment, verify it
       localStorage['ws_fs_token']  -> verify it with GET /api/v1/auth/me, publish to sessionStorage
     On 200 the user continues into /dashboard with a real session; on failure the unusable token is
     dropped and this page's own sign-in form is shown. It is a NO-OP on every public customer
     surface, which are separate documents served by their own nginx locations. -->
<script>
!function(){
  var p = window.location.pathname;
  if (/^\/(play|loyalty-checkin)\//.test(p)) return;
  if (p === '/tablet-demo.html' || p === '/login' || p === '/login.html') return;
  if (p.indexOf('/api/') === 0 || p.indexOf('/ref/') === 0) return;

  var TK = 'is_token', UK = 'is_user', DASH = '/dashboard', STORE = 'ws_fs_token';
  function haveSession() { try { return !!sessionStorage.getItem(TK); } catch (e) { return true; } }

  // Read '#token=<jwt>' and strip it. The fragment is never sent to the server, but do not leave a
  // credential sitting in the address bar or in the history entry either (history.replaceState).
  function tokenFromHash() {
    var hm = /[#&](?:token|access_token)=([^&]+)/.exec(window.location.hash || '');
    if (!hm) return null;
    try { history.replaceState(null, '', p + window.location.search); } catch (e) {}
    try { return decodeURIComponent(hm[1]); } catch (e) { return hm[1]; }
  }

  function adopt(t) {
    var busy = document.createElement('style');
    busy.id = 'is-handoff-busy';
    busy.textContent = 'html{visibility:hidden}';
    (document.head || document.documentElement).appendChild(busy);
    var settle = setTimeout(function () { var b = document.getElementById('is-handoff-busy'); if (b && b.parentNode) b.parentNode.removeChild(b); }, 10000);

    fetch('/api/v1/auth/me', { headers: { 'Authorization': 'Bearer ' + t }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        clearTimeout(settle);
        try {
          sessionStorage.setItem(TK, t);
          sessionStorage.setItem(UK, JSON.stringify((d && d.user) || d || {}));
        } catch (e) {}
        window.location.replace(DASH);
      })
      .catch(function (err) {
        clearTimeout(settle);
        // A token the SERVER refused is dead: drop it from both stores and send the visitor to the
        // canonical sign-in page, so the stale value can never be tried again on the next visit.
        // A network/5xx failure says nothing about the token, so it is left in place and the form
        // below takes over — a blip must not sign a customer out.
        var refused = /HTTP 40[13]/.test(String((err && err.message) || err));
        if (refused) {
          try { sessionStorage.removeItem(TK); sessionStorage.removeItem(UK); } catch (e) {}
          try { localStorage.removeItem(STORE); } catch (e) {}
        }
        var b = document.getElementById('is-handoff-busy'); if (b && b.parentNode) b.parentNode.removeChild(b);
        // Ask the sign-in page to SHOW the reason. `login.html` has carried the `?expired=1` arm
        // (the sentence "Your session ended, so you were signed out") since it was written, but nothing ever
        // asked for it: this redirect used the bare path, so a customer whose token the server
        // refused was dropped on a silent sign-in form with no explanation. Measured live
        // 2026-10-26 in Chromium: a bogus token at `/` landed on `/login` with an empty message.
        if (refused) window.location.replace('/login?expired=1');
      });
  }

  function start() {
    // A VISITOR WHO IS ALREADY SIGNED IN BELONGS AT THE CONSOLE (measured defect, 2026-10-26).
    // The console keeps its session in sessionStorage `is_token` (login.html hands the JWT over
    // through localStorage `ws_fs_token`, and adopt() below copies it here). This block used to
    // return the moment `haveSession()` was true, and the AUTH GUARD after it only looked at
    // localStorage — so a customer who signed in and then opened the app root in the SAME tab was
    // shown the sign-in form again, on a live session. Measured live in Chromium: a seeded valid
    // session rendered "Sign in to your account" at `/`. Read the session token first and send it
    // through adopt(), which VALIDATES it against /auth/me and only then redirects to the console;
    // an expired token still falls through to the form (and is dropped from storage on the way).
    var t = null;
    try { t = sessionStorage.getItem(TK); } catch (e) {}
    if (!t) t = tokenFromHash();
    if (t) { try { localStorage.setItem(STORE, t); } catch (e) {} }
    else { try { t = localStorage.getItem(STORE) || localStorage.getItem('token') || localStorage.getItem('access_token'); } catch (e) {} }
    if (!t) return;
    adopt(t);
  }

  start();
  // A handoff link opened while this document is already showing (same-document fragment change)
  // does not reload the page, so the block above would never run again. Honour it.
  window.addEventListener('hashchange', function () {
    if (haveSession()) return;
    var t = tokenFromHash();
    if (!t) return;
    try { localStorage.setItem(STORE, t); } catch (e) {}
    adopt(t);
  });
}();
</script>

<!-- AUTH GUARD — canonical login redirect -->
<script>
!function(){
  var p = window.location.pathname;
  if (p === '/login' || p === '/login.html' || p.startsWith('/api/') || p.startsWith('/ref/')) return;
  var t = null;
  try { t = sessionStorage.getItem('is_token'); } catch (e) {}
  t = t || localStorage.getItem('ws_fs_token') || localStorage.getItem('token') || localStorage.getItem('access_token');
  if (!t) window.location.replace('/login');
}();
</script>

<style>
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:32px;width:100%;max-width:400px}
.btn{background:#2563eb;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;border:none;font-weight:500;width:100%;font-size:15px;transition:background .2s}
.btn:hover{background:#1d4ed8}
.btn:disabled{opacity:.6;cursor:not-allowed}
.input{border:1px solid #cbd5e1;border-radius:8px;padding:10px 14px;width:100%;font-size:14px;outline:0;box-sizing:border-box;transition:border-color .2s}
.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.spinner{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.tabs{display:flex;margin-bottom:24px;border-bottom:2px solid #e2e8f0}.tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:14px;font-weight:500;color:#94a3b8;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}.tab.active{color:#2563eb;border-bottom-color:#2563eb}.tab-content{display:none}.tab-content.active{display:block}
</style>
<link rel="stylesheet" href="/tw.css">
</head>
<body>
<div class="card">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Sign In</div>
    <div class="tab" onclick="switchTab('register')">Create Account</div>
  </div>
  <div style="text-align:center;margin-bottom:28px">
    <h1 style="font-size:24px;font-weight:700;color:#1e293b;margin:0">IncentiveSwift</h1>
    <p style="color:#64748b;font-size:14px;margin:6px 0 0">Sign in to your account</p>
  </div>
  <div class="error" id="error"></div>
  <div class="tab-content active" id="loginTab">
  <form id="loginForm" style="display:flex;flex-direction:column;gap:16px">
    <div>
      <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Email</label>
      <input type="email" class="input" id="email" placeholder="you@company.com" required autocomplete="email">
    </div>
    <div>
      <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Password</label>
      <input type="password" class="input" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
  </form>  </div>
  <div class="tab-content" id="registerTab">
    <form id="registerForm" style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Full Name</label>
        <input type="text" class="input" id="regName" placeholder="John Doe" required autocomplete="name">
      </div>
      <div>
        <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Email</label>
        <input type="email" class="input" id="regEmail" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#0c4a6e">
        We'll email you a password. Just give us your name and email &mdash; your login details arrive by
        email, and you can change the password from your profile once you're in.
      </div>
      <button type="submit" class="btn" id="regBtn">Create Free Account</button>
      <p style="text-align:center;font-size:12px;color:#94a3b8;margin:0">No credit card required</p>
    </form>
  </div>

  <!-- User Guide entry point (kanban t_15f0bf7d, fleet standard t_c504d969): app.incentiveswift.com
       serves the tenant guide at /guide.html and the app shell linked it nowhere, so a user had to be
       told the URL. Sits in the shell's footer (the login shell has no sidebar yet). -->
  <p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:20px">
    <a href="/guide.html" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none">📖 User Guide</a>
    <span style="margin:0 6px">&middot;</span>IncentiveSwift &copy; 2026
  </p>
</div>

<script>
const API_BASE = window.location.origin + '/api/v1';
const TOKEN_KEY = 'is_token';
const USER_KEY = 'is_user';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  errorEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:middle"></span> Signing in...';

  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || data.message || 'Invalid credentials');
    
    sessionStorage.setItem(TOKEN_KEY, data.token);
    sessionStorage.setItem(USER_KEY, JSON.stringify(data.user || data));
    window.location.href = '/dashboard';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  if (tab === 'login') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('loginTab').classList.add('active');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('registerTab').classList.add('active');
  }
  document.getElementById('error').style.display = 'none';
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('regBtn');
  errorEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:middle"></span> Creating account...';

  try {
    const res = await fetch(API_BASE + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // NAME + EMAIL only: the server generates the password and emails it (David's rule —
      // an automatic two-step verification, and nothing for the user to invent).
      body: JSON.stringify({
        email: document.getElementById('regEmail').value,
        name: document.getElementById('regName').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || data.message || 'Registration failed');

    // Deliberately NOT an auto-login: the whole point of the generated credential is that the user
    // signs in with the password that was just emailed, so the account and the email are proved to
    // agree. Sending them straight to the dashboard would hide a broken credential mail until their
    // first real sign-in.
    const email = document.getElementById('regEmail').value;
    const safeEmail = email.replace(/[<>&]/g, '');
    const signInButton = '<button class="btn" style="margin-top:14px" onclick="document.querySelector(\'.tab\').click()">Go to Sign In</button>';
    if (data.credentials_emailed) {
      document.getElementById('registerForm').innerHTML =
        '<div style="text-align:center">' +
        '<div style="font-size:34px;margin-bottom:8px">📬</div>' +
        '<div style="font-size:16px;font-weight:600;color:#0f172a;margin-bottom:6px">Account created</div>' +
        '<div style="font-size:13.5px;color:#475569;line-height:1.5">We have emailed your password to ' +
        '<strong>' + safeEmail + '</strong>.<br>Open that email and sign in with it &mdash; ' +
        'you can change it from your profile afterwards.</div>' + signInButton +
        '</div>';
      return;
    }
    // The mail did NOT go out (the provider refused, or the address cannot receive). Telling the
    // visitor to "check your email" here would strand them with an account whose password nobody
    // has ever seen, so this page asks them to CHOOSE one now: the server accepts exactly one such
    // password, on the signup token, while the account still carries the undelivered marker.
    document.getElementById('registerForm').innerHTML =
      '<div style="text-align:center">' +
      '<div style="font-size:34px;margin-bottom:8px">⚠️</div>' +
      '<div style="font-size:16px;font-weight:600;color:#0f172a;margin-bottom:6px">Account created &mdash; but we could not email your password</div>' +
      '<div style="font-size:13.5px;color:#475569;line-height:1.5">No message reached <strong>' + safeEmail +
      '</strong>. Check that address for a typo &mdash; that is the usual reason. Choose a password now and you can sign in straight away.</div>' +
      '<div style="text-align:left;margin-top:14px">' +
      '<label style="font-size:12.5px;font-weight:600;color:#0f172a;display:block;margin-bottom:4px">Choose a password</label>' +
      '<input class="input" id="initPw" type="password" placeholder="At least 8 characters" style="width:100%;margin-bottom:8px">' +
      '<input class="input" id="initPw2" type="password" placeholder="Type it again" style="width:100%">' +
      '<div id="initErr" style="display:none;color:#b91c1c;font-size:12.5px;margin-top:8px"></div>' +
      '<button class="btn" id="initBtn" style="width:100%;margin-top:12px">Set my password</button>' +
      '</div>' +
      '<div style="font-size:12px;color:#64748b;margin-top:10px">Got a working password already? ' +
      '<a href="#" onclick="document.querySelector(\'.tab\').click();return false;" style="color:#4f46e5">Sign in</a></div>' +
      '</div>';
    const initBtn = document.getElementById('initBtn');
    initBtn.addEventListener('click', async () => {
      const pw1 = document.getElementById('initPw').value;
      const pw2 = document.getElementById('initPw2').value;
      const errBox = document.getElementById('initErr');
      const show = (m) => { errBox.textContent = m; errBox.style.display = 'block'; };
      errBox.style.display = 'none';
      if (pw1.length < 8) return show('Use at least 8 characters.');
      if (pw1 !== pw2) return show('The two passwords do not match.');
      initBtn.disabled = true; initBtn.textContent = 'Saving...';
      try {
        const r = await fetch(API_BASE + '/auth/initial-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + data.token },
          body: JSON.stringify({ password: pw1 })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || d.message || 'Could not set the password');
        document.getElementById('registerForm').innerHTML =
          '<div style="text-align:center">' +
          '<div style="font-size:34px;margin-bottom:8px">✅</div>' +
          '<div style="font-size:16px;font-weight:600;color:#0f172a;margin-bottom:6px">Password saved</div>' +
          '<div style="font-size:13.5px;color:#475569;line-height:1.5">Sign in with <strong>' + safeEmail +
          '</strong> and the password you just chose.</div>' + signInButton +
          '</div>';
      } catch (e2) {
        initBtn.disabled = false; initBtn.textContent = 'Set my password';
        show(e2.message);
      }
    });
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Free Account';
  }
});

// Check if already logged in
const token = sessionStorage.getItem(TOKEN_KEY);
const user = sessionStorage.getItem(USER_KEY);
if (token && user) {
  window.location.href = '/dashboard';
}
</script>
</body>
</html>
