<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loyalty Check-In</title>
<meta name="description" content="Check in and collect your points.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="IncentiveSwift">
<meta property="og:title" content="Loyalty Check-In">
<meta property="og:description" content="Check in and collect your points.">
<meta property="og:image" content="https://incentiveswift.com/assets/og-incentiveswift.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Loyalty Check-In">
<meta name="twitter:description" content="Check in and collect your points.">
<meta name="twitter:image" content="https://incentiveswift.com/assets/og-incentiveswift.png">
<!--
  The page a CUSTOMER lands on after scanning the QR on a business's counter.
  It is deliberately outside the tenant SPA: the visitor has no account, so
  there is no auth guard, no token and no login bounce. It talks to three public
  endpoints only:
    GET  /api/v1/loyalty/public/program/<slug>   -> what to render
    POST /api/v1/loyalty/checkin                 -> award the points
    POST /api/v1/loyalty/secret-code/verify      -> award a secret code's points
  Served for /loyalty-checkin/* by an nginx location in
  /opt/swift/nginx/sites/incentiveswift.conf.
-->
<style>
:root{--brand:#2563eb}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f1f5f9;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:28px;width:100%;max-width:420px}
h1{font-size:22px;margin:0 0 4px;color:#0f172a}
.biz{color:#64748b;font-size:14px;margin:0 0 20px}
.pill{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin-bottom:20px}
label{font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px}
input{border:1px solid #cbd5e1;border-radius:8px;padding:10px 14px;width:100%;font-size:15px;outline:0;margin-bottom:14px}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
button{background:var(--brand);color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;border:none;font-weight:600;width:100%;font-size:15px}
button:hover{background:#1d4ed8}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:none}
.err{background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}
.hint{font-size:12px;color:#94a3b8;text-align:center;margin:16px 0 0}
.big{font-size:34px;font-weight:700;color:#166534;text-align:center;margin:8px 0}
.sep{border-top:1px solid #e2e8f0;margin:22px 0 18px}
.code-hint{font-size:12px;color:#94a3b8;margin:0 0 12px}
/* The business's own identity, when it has configured one (email branding). A centred logo (max
   56px high / 240px wide) or the brand name, then a 3px rule in the brand colour — the same header
   block Branding::header_html paints on this tenant's mail and the campaign player shows. Hidden
   entirely when the tenant configured nothing, so an unbranded page is unchanged. */
.brandbar{display:none;text-align:center;padding-bottom:14px;margin-bottom:16px}
.brandbar img{max-height:56px;max-width:240px;display:inline-block}
.brandbar .bn{font-weight:700;font-size:20px;letter-spacing:.2px}
/* The owner's tier ladder (2026-11-08). Rendered only when the programme has tiers switched on;
   each row is the tier's own colour dot, its name and the points needed to reach it — the same
   ladder the check-in applies a multiplier from. */
.tiers{margin:0 0 18px;padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}
.tiers-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b;margin-bottom:8px}
.tier-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;padding:3px 0}
.tier-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:#94a3b8}
.tier-name{font-weight:600;color:#0f172a}
.tier-at{margin-left:auto;color:#64748b;font-variant-numeric:tabular-nums}
.next-tier{margin-top:8px;font-size:14px;color:#334155}
.brandbar .rule{border-top:3px solid #4f46e5;margin-top:12px}
/* The owner's streak offer (2026-11-10). Shown only when the programme actually PAYS a streak
   bonus, so an owner with streaks off gets a byte-identical page. */
.streak{margin:0 0 18px;padding:11px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13.5px;color:#78350f}
/* The member's OWN sharing card (2026-11-08). Rendered only after a check-in (that is when the
   member's referral code exists) and only when the owner has actually offered points for sharing —
   so an owner who has not configured it gets a byte-identical page. */
.share{margin:22px 0 0;padding:14px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}
.share-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b;margin-bottom:8px}
.share-p{font-size:13px;color:#475569;margin:0 0 10px;line-height:1.45}
.share-link{display:flex;gap:8px;margin-bottom:12px}
.share-link input{flex:1;font-size:12px;margin:0;padding:9px 10px;background:#fff}
.share-link button{width:auto;padding:9px 14px;font-size:13px;flex:0 0 auto}
.share-btns{display:flex;gap:8px;flex-wrap:wrap}
.share-btns button{width:auto;flex:1 1 auto;padding:10px 12px;font-size:13px;background:#0f172a}
.share-btns button:hover{background:#1e293b}
.share-btns button:disabled{opacity:.6;cursor:not-allowed}
.share-stats{font-size:12px;color:#64748b;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div id="loading" style="text-align:center;color:#64748b;padding:30px 0">Loading your rewards…</div>

  <div id="panel" style="display:none">
    <div class="brandbar" id="brandBar"></div>
    <h1 id="programName">Loyalty rewards</h1>
    <p class="biz" id="businessName"></p>
    <div class="pill" id="pointsPill"></div>
    <div class="streak" id="streakOffer" style="display:none"></div>

    <div class="msg err" id="error"></div>
    <div class="msg ok" id="success"></div>

    <form id="checkinForm">
      <label for="firstName">First name</label>
      <input id="firstName" type="text" autocomplete="given-name" required>
      <label for="lastName">Last name</label>
      <input id="lastName" type="text" autocomplete="family-name">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <!-- Optional date of birth. This is the ONLY place the date is captured: it is what the
           owner's "Birthday bonus" (console > Loyalty > programme form) is paid on, once a year,
           on the check-in that falls on the member's birthday. Blank is fine — no bonus, no ask. -->
      <label for="birthday">Birthday <span style="font-weight:400;color:#6b7280">(optional)</span></label>
      <input id="birthday" type="date" autocomplete="bday">
      <button type="submit" id="btn">Check in &amp; earn points</button>
    </form>

    <p class="hint">No account needed — just check in.</p>

    <div class="sep"></div>

    <!-- Secret code redemption. Same visitor, same contact fields: a code is
         minted by the tenant in the admin console (panel 11, "Loyalty secret
         codes") and posted to POST /api/v1/loyalty/secret-code/verify with the
         CAMPAIGN slug, exactly like the check-in above. Without this box the
         endpoint had no caller anywhere in the product. -->
    <form id="codeForm">
      <label for="secretCode">Have a secret code?</label>
      <p class="code-hint">Enter the code your business gave you and it is added to the points above.</p>
      <input id="secretCode" type="text" autocomplete="off" placeholder="e.g. FBGROUP2026">
      <button type="submit" id="codeBtn">Redeem code</button>
    </form>

    <!-- The member's OWN sharing card (2026-11-08). Every route behind it already existed and
         worked — `/loyalty/online/share`, `/online/referral-click` and `/online/stats/:code` — but
         no page anywhere showed a member their referral link, so the whole share/referral half of
         the programme was unreachable AND the member created by a check-in was never given a code
         at all. Shown only after a check-in (the moment the code exists) and only when the owner has
         actually offered points for sharing. -->
    <div class="share" id="shareBlock" style="display:none">
      <div class="share-h">Earn more</div>
      <p class="share-p" id="shareIntro"></p>
      <div class="share-link">
        <input id="shareLink" type="text" readonly aria-label="Your personal sharing link">
        <button type="button" id="copyBtn">Copy</button>
      </div>
      <div class="share-btns" id="shareBtns"></div>
      <div class="share-stats" id="shareStats"></div>
    </div>
    <div class="share-stats" id="visitNote" style="display:none"></div>
  </div>
</div>

<script>
(function () {
  var slug = decodeURIComponent(window.location.pathname.replace(/^\/loyalty-checkin\//, '').replace(/\/+$/, ''));
  var api = window.location.origin + '/api/v1';
  var el = function (id) { return document.getElementById(id); };

  function fail(text, banner) {
    el('loading').style.display = 'none';
    el('panel').style.display = 'block';
    if (banner) {
      el('error').textContent = text;
      el('error').style.display = 'block';
      el('checkinForm').style.display = 'none';
      el('codeForm').style.display = 'none';
    } else {
      el('error').textContent = text;
      el('error').style.display = 'block';
    }
  }

  if (!slug) { fail('This check-in link is incomplete. Please scan the QR code again.', true); return; }

  // ── WHAT THE MEMBER SEES WHEN THEY COME BACK (2026-11-14) ─────────────────────────────────────
  // The daily-visit arm answers `already_visited_today` for the commonest visit of all: a member
  // opening their own card link a second time the same day. This page used to return early on any
  // answer that awarded nothing, so those members were shown NOTHING — the balance they came to look
  // at was nowhere on the page, and the form sat there as if they had never arrived. `total_balance`
  // is on EVERY arm of that reply, so the note now states it, names the owner's own currency once the
  // programme is loaded, and measures the gap to the next rung of the owner's ladder. The server's own
  // sentence is preferred wherever it sent one; nothing here invents a number.
  var progDoc = null;
  var visitReply = null;
  function renderVisitNote() {
    var note = el('visitNote');
    var r = visitReply;
    if (!note || !r) return;
    var cur = (progDoc && progDoc.currency_name) || r.currency_name || 'points';
    var n = Number(r.points_awarded || 0);
    var bal = (r.total_balance != null) ? Number(r.total_balance) : null;
    var parts = [];
    if (r.message) parts.push(String(r.message));
    else if (n > 0) parts.push('Visit recorded \u2014 ' + n + ' ' + cur + ' added to this card today.');
    if (bal != null) parts.push('You now have ' + bal + ' ' + cur + '.');
    var ladder = (progDoc && progDoc.tiers && progDoc.tiers.length) ? progDoc.tiers : null;
    if (ladder && bal != null) {
      for (var i = 0; i < ladder.length; i++) {
        if ((ladder[i].min_points || 0) > bal) {
          parts.push(((ladder[i].min_points || 0) - bal) + ' ' + cur + ' to go until ' + ladder[i].name + '.');
          break;
        }
      }
    }
    if (!parts.length) return;
    note.textContent = parts.join(' ');
    note.style.display = 'block';
  }

  // A friend arriving from a member's sharing link (`?ref=<code>`). Recorded ONCE per browser per
  // code, and only after the server confirmed it, so a reload (or a flaky connection that already
  // landed) cannot inflate the referrer's click count. No points are awarded here — the endpoint
  // deliberately records the click only, and the referrer's bonus is paid when the visitor converts.
  (function () {
    var ref = null;
    try { ref = new URLSearchParams(window.location.search).get('ref'); } catch (e) {}
    if (!ref) return;
    var key = 'loy_ref_' + ref;
    try { if (localStorage.getItem(key)) return; } catch (e) {}
    fetch(api + '/loyalty/online/referral-click', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ referrer_code: ref, url: window.location.href })
    })
      .then(function (r) { if (r.ok) { try { localStorage.setItem(key, '1'); } catch (e) {} } })
      .catch(function () {});
  })();

  // The owner's "Points per visit" rule (2026-11-10). `POST /loyalty/online/visit` is the ONLY
  // route that credits `points_per_visit`, and until now no page anywhere called it — so an
  // operator could set the number in the admin console while no visit was ever rewarded. A member
  // opening their own card link (`?ref=<code>`, the link this page hands them) IS that visit: it is
  // recorded once per browser per day, which is the handler's own cap (one `daily_visit` row per
  // member per day), and the reply's own sentence is shown rather than an invented one.
  (function () {
    var ref = null;
    try { ref = new URLSearchParams(window.location.search).get('ref'); } catch (e) {}
    if (!ref) return;
    var today = new Date().toISOString().slice(0, 10);
    var key = 'loy_visit_' + ref + '_' + today;
    try { if (localStorage.getItem(key)) return; } catch (e) {}
    fetch(api + '/loyalty/online/visit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ referral_code: ref, url: window.location.href, user_agent: navigator.userAgent })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (!res.ok) return;
        try { localStorage.setItem(key, '1'); } catch (e) {}
        // Kept, not painted here: the note names the owner's currency and ladder, which arrive with
        // the programme document below — whichever fetch lands first calls `renderVisitNote`.
        visitReply = res.data || {};
        renderVisitNote();
      })
      .catch(function () {});
  })();

  fetch(api + '/loyalty/public/program/' + encodeURIComponent(slug))
    .then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; });
    })
    .then(function (res) {
      if (!res.ok) { fail(res.data && res.data.message ? res.data.message : 'This check-in link is not active.', true); return; }
      var d = res.data;
      el('programName').textContent = d.program_name || 'Loyalty rewards';
      el('businessName').textContent = d.business_name ? ('at ' + d.business_name) : '';
      // The owner's own identity above the programme name (2026-11-07). `brand` is present only for
      // a tenant that configured email branding; its `color` is validated hex server-side
      // (Branding::effective_color) and its `logo_url` is only ever a stored, verified pointer, so a
      // removed logo cannot arrive here. No brand => the bar stays hidden and the page is unchanged.
      (function () {
        var brand = d.brand || null;
        if (!brand || (!brand.name && !brand.logo_url)) return;
        var bar = el('brandBar');
        bar.innerHTML = '';
        if (brand.logo_url) {
          var img = document.createElement('img');
          img.alt = brand.name || d.business_name || 'Business logo';
          img.src = brand.logo_url;
          bar.appendChild(img);
        } else {
          var nm = document.createElement('div');
          nm.className = 'bn';
          nm.textContent = brand.name;
          nm.style.color = /^#[0-9a-fA-F]{3,8}$/.test(brand.color || '') ? brand.color : '#4f46e5';
          bar.appendChild(nm);
        }
        var rule = document.createElement('div');
        rule.className = 'rule';
        rule.style.borderTopColor = /^#[0-9a-fA-F]{3,8}$/.test(brand.color || '') ? brand.color : '#4f46e5';
        bar.appendChild(rule);
        bar.style.display = 'block';
      })();
      el('pointsPill').textContent = '+' + (d.points_per_checkin || 0) + ' ' +
        (d.currency_name || 'points') + ' per check-in';
      // The owner's streak offer, BEFORE the member checks in (2026-11-10). The bonus is paid
      // (mechanics::loyalty_checkin) but the page only ever named it on the receipt — after it
      // had already paid — so no member could know to come back tomorrow. Both fields are served
      // only when the owner switched streaks on AND the terms are usable, so an owner with
      // streaks off renders exactly the page they rendered before.
      if (d.streak_enabled && d.streak_bonus > 0 && d.streak_days > 1) {
        var so = el('streakOffer');
        so.style.display = 'block';
        so.textContent = 'Come back ' + d.streak_days + ' days in a row and earn an extra +' +
          d.streak_bonus + ' ' + (d.currency_name || 'points') + ' when the run completes.';
      }
      // The owner's tier ladder (2026-11-08). `tiers` is served only when the owner switched tiers
      // on (name / threshold / colour, cheapest first), so an untiered programme renders exactly as
      // before. Shown BEFORE the form: a member who has not checked in yet still learns what is
      // reachable, which is the whole point of publishing a ladder.
      var ladder = (d.tiers && d.tiers.length) ? d.tiers : null;
      if (ladder) {
        var box = document.createElement('div');
        box.className = 'tiers';
        var hd = document.createElement('div');
        hd.className = 'tiers-h';
        hd.textContent = 'Tiers';
        box.appendChild(hd);
        ladder.forEach(function (t) {
          var row = document.createElement('div');
          row.className = 'tier-row';
          var dot = document.createElement('span');
          dot.className = 'tier-dot';
          dot.style.background = /^#[0-9a-fA-F]{3,8}$/.test(t.color || '') ? t.color : '#94a3b8';
          row.appendChild(dot);
          var nm = document.createElement('span');
          nm.className = 'tier-name';
          nm.textContent = t.name;
          row.appendChild(nm);
          var at = document.createElement('span');
          at.className = 'tier-at';
          at.textContent = (t.min_points || 0) + '+ ' + (d.currency_name || 'points');
          row.appendChild(at);
          box.appendChild(row);
        });
        el('panel').insertBefore(box, el('checkinForm'));
      }
      // The programme document is what names the currency and the ladder, so the daily-visit note is
      // (re)painted HERE — this fetch and the visit fetch race, and whichever lands second wins.
      progDoc = d;
      renderVisitNote();
      el('loading').style.display = 'none';
      el('panel').style.display = 'block';

      // ── THE MEMBER'S OWN SHARING CARD (2026-11-08) ───────────────────────────────────────────
      // Built from values the server already decides: the member's referral code (returned by the
      // check-in that just succeeded) and the owner's `social_share_points`. Nothing is invented
      // here — when the owner has not offered points for sharing, no card appears at all.
      var shareBase = window.location.origin + '/loyalty-checkin/' + encodeURIComponent(slug);

      function shareStats(code) {
        fetch(api + '/loyalty/online/stats/' + encodeURIComponent(code))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (s) {
            if (!s) return;
            var cur = d.currency_name || 'points';
            var bits = [];
            bits.push(s.total_shares + ' share' + (s.total_shares === 1 ? '' : 's'));
            bits.push(s.referral_clicks + ' click' + (s.referral_clicks === 1 ? '' : 's') + ' on your link');
            if (s.online_points_earned > 0) bits.push(s.online_points_earned + ' ' + cur + ' earned from sharing');
            el('shareStats').textContent = bits.join(' · ');
          })
          .catch(function () {});
      }

      function renderShare(code) {
        var pts = d.social_share_points || 0;
        if (!code || pts <= 0) return;
        var cur = d.currency_name || 'points';
        var link = shareBase + '?ref=' + encodeURIComponent(code);

        el('shareIntro').textContent = 'Share your link and earn ' + pts + ' ' + cur +
          ' the first time you share on each platform each day. Friends who join through it count toward your referrals.';
        el('shareLink').value = link;
        el('shareStats').textContent = '';
        el('shareBlock').style.display = 'block';

        el('copyBtn').onclick = function () {
          var done = function () {
            el('copyBtn').textContent = 'Copied';
            setTimeout(function () { el('copyBtn').textContent = 'Copy'; }, 1600);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(done, function () { el('shareLink').select(); });
          } else {
            el('shareLink').select();
            try { document.execCommand('copy'); } catch (e) {}
            done();
          }
        };

        var PLATFORMS = [
          { key: 'whatsapp', label: 'WhatsApp', url: 'https://wa.me/?text=' + encodeURIComponent(link) },
          { key: 'facebook', label: 'Facebook', url: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link) },
          { key: 'twitter', label: 'X', url: 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(link) },
          { key: 'email', label: 'Email', url: 'mailto:?subject=' + encodeURIComponent(d.program_name || 'Our rewards programme') + '&body=' + encodeURIComponent('Join here: ' + link) }
        ];

        var box = el('shareBtns');
        box.innerHTML = '';
        PLATFORMS.forEach(function (p) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = p.label;
          b.onclick = function () {
            b.disabled = true;
            fetch(api + '/loyalty/online/share', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ referral_code: code, platform: p.key, url: link })
            })
              .then(function (r) {
                return r.json()
                  .then(function (j) { return { ok: r.ok, data: j }; })
                  .catch(function () { return { ok: false, data: {} }; });
              })
              .then(function (out) {
                b.disabled = false;
                var o = out.data || {};
                if (out.ok && o.points_awarded > 0) {
                  el('error').style.display = 'none';
                  el('success').innerHTML = '<div class="big">+' + o.points_awarded + ' ' + cur + '</div>' +
                    'Thanks for sharing. You now have ' + o.total_balance + ' ' + cur + '.';
                  el('success').style.display = 'block';
                } else if (out.ok && o.status === 'already_shared_today') {
                  el('error').textContent = o.message || 'You already earned that platform\u2019s points today.';
                  el('error').style.display = 'block';
                }
                shareStats(code);
                window.open(p.url, '_blank', 'noopener');
              })
              .catch(function () {
                b.disabled = false;
                window.open(p.url, '_blank', 'noopener');
              });
          };
          box.appendChild(b);
        });

        shareStats(code);
      }

      el('checkinForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = el('btn');
        el('error').style.display = 'none';
        el('success').style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Checking in…';

        fetch(api + '/loyalty/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            // `checkin_slug` from the API: the campaign slug when the programme is linked to a
            // campaign, otherwise the programme's own slug. Both are resolved by the same server
            // resolver, so the QR works for a programme the console created with no campaign.
            program_slug: d.checkin_slug || d.campaign_slug,
            method: 'qr',
            // The optional date typed above. The server stores it on the member row, and pays the
            // owner's "Birthday bonus" when the check-in falls on that day — once per calendar year.
            birthday: el('birthday').value || null,
            contact: {
              first_name: el('firstName').value,
              last_name: el('lastName').value || null,
              email: el('email').value
            }
          })
        })
          .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, data: b }; }); })
          .then(function (out) {
            if (!out.ok) {
              fail(out.data && (out.data.message || out.data.error) ? (out.data.message || out.data.error) : 'Could not check you in.');
              btn.disabled = false; btn.textContent = 'Check in & earn points';
              return;
            }
            var b = out.data;
            el('checkinForm').style.display = 'none';
            if (b.status === 'credit_pool_exhausted') {
              el('error').textContent = b.message || 'This business has used up its monthly points credit.';
              el('error').style.display = 'block';
              return;
            }
            if (b.status === 'daily_cap_reached') {
              el('error').textContent = b.message || 'You have already checked in here today.';
              el('error').style.display = 'block';
              return;
            }
            var pts = b.points_awarded || 0;
            var cur = d.currency_name || 'points';
            el('success').innerHTML = '<div class="big">+' + pts + ' ' + cur + '</div>' +
              'You now have ' + (b.new_balance != null ? b.new_balance : '') + ' ' + cur + '.' +
              // The owner's consecutive-day bonus, paid from 2026-11-10. Shown only when this
              // very check-in completed a block (the server returns the run length), so the card
              // never claims a streak the programme did not pay for.
              (b.streak_bonus > 0
                ? '<br><b>Streak bonus: +' + b.streak_bonus + ' ' + cur + ' \u2014 ' +
                  b.streak_days_run + ' days running.</b>'
                : '') +
              // The owner's birthday bonus. Paid once a calendar year, on the check-in that
              // falls on the member's own birthday, and shown only when THIS check-in paid it.
              (b.birthday_bonus > 0
                ? '<br><b>\ud83c\udf82 Happy birthday! +' + b.birthday_bonus + ' ' + cur +
                  ' birthday bonus.</b>'
                : '') +
              (b.tier ? '<br>Tier: ' + b.tier : '') +
              // A rung crossed by THIS check-in is the moment the ladder pays off, and the
              // award already returned both names (`tier` is where the member stands now,
              // `earned_at_tier` is where the multiplier came from). Say the promotion out
              // loud instead of leaving the member to notice the number changed.
              (b.tier && b.earned_at_tier && b.tier !== b.earned_at_tier
                ? '<br><b>You\u2019ve moved up to ' + b.tier + '.</b>' : '');
            // How far the member is from the NEXT rung, from the balance the award just returned
            // (2026-11-08). Silence about the gap is what makes a ladder feel unreachable; the
            // number comes from the owner's own thresholds, never from a guess.
            if (ladder && b.new_balance != null) {
              var nxt = null;
              for (var i = 0; i < ladder.length; i++) {
                if ((ladder[i].min_points || 0) > b.new_balance) { nxt = ladder[i]; break; }
              }
              if (nxt) {
                var gap = document.createElement('div');
                gap.className = 'next-tier';
                gap.textContent = ((nxt.min_points || 0) - b.new_balance) + ' ' + cur +
                  ' to go until ' + nxt.name + '.';
                el('success').appendChild(gap);
              }
            }
            el('success').style.display = 'block';
            // The member's code now exists, so their sharing link can be shown. Rendering AFTER
            // the award means the balance, the rung and the sharing card always agree.
            renderShare(b.referral_code);
          })
          .catch(function () { fail('Something went wrong. Please try again.'); btn.disabled = false; btn.textContent = 'Check in & earn points'; });
      });

      // Secret code redemption — same contact fields as the check-in above, so
      // the points land on the same member row.
      el('codeForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = el('codeBtn');
        var code = el('secretCode').value.trim();
        el('error').style.display = 'none';
        el('success').style.display = 'none';
        if (!code) { fail('Enter the code your business gave you.', false); return; }
        if (!el('email').value.trim()) { fail('Add your email above first — it is how your points are kept.', false); return; }
        btn.disabled = true;
        btn.textContent = 'Redeeming…';

        fetch(api + '/loyalty/secret-code/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            program_slug: d.checkin_slug || d.campaign_slug,
            secret_code: code,
            contact: {
              first_name: el('firstName').value || null,
              last_name: el('lastName').value || null,
              email: el('email').value
            }
          })
        })
          .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, data: b }; }); })
          .then(function (out) {
            btn.disabled = false; btn.textContent = 'Redeem code';
            if (!out.ok) {
              fail(out.data && (out.data.message || out.data.error) ? (out.data.message || out.data.error) : 'That code was not accepted.', false);
              return;
            }
            var b = out.data;
            var cur = d.currency_name || 'points';
            el('secretCode').value = '';
            el('success').innerHTML = '<div class="big">+' + (b.points_earned || 0) + ' ' + cur + '</div>' +
              (b.message ? b.message + '<br>' : '') +
              'You now have ' + (b.total_points != null ? b.total_points : '') + ' ' + cur + '.';
            el('success').style.display = 'block';
          })
          .catch(function () { fail('Could not reach the rewards service. Please try again.', false); btn.disabled = false; btn.textContent = 'Redeem code'; });
      });
    })
    .catch(function () { fail('Could not reach the rewards service. Please try again.', true); });
})();
</script>
</body>
</html>
