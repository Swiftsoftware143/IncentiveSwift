name: Deploy IncentiveSwift

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: 178.156.221.18
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e
          echo "=== Deploying IncentiveSwift ==="
          cd /opt/swift/incentiveswift
          git pull origin main
          cp incentiveswift-api /opt/swift/incentiveswift/incentiveswift-api 2>/dev/null || true
          systemctl restart incentiveswift
          sleep 2
          systemctl --no-pager status incentiveswift --no-pager | head -5
          echo "=== Deploy complete ==="
