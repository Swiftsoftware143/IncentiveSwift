name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain to 1.97.1 to match the fleet build box: @stable would
      # pull in newer clippy lints (e.g. needless_bool) that fail in CI while
      # passing locally. The version and components are also declared in
      # rust-toolchain.toml at the repo root.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release
